        }

        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }

        .app-container {

            position: relative;

            display: flex;

        /* 音乐控制悬浮按钮 */
        .bgm-toggle-btn {

            right: 15px;
            z-index: 100;

            border: 2px solid var(--accent-yellow);
            color: #fff;
            font-size: 20px;

            transition: all 0.2s;

        .shake { animation: shakeAnim 0.4s ease-in-out; }

            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-12px); }
            40%, 80% { transform: translateX(12px); }
        }

<!-- 🔊 Web Audio API 声音系统 -->
<script>
    class SoundEngine {
        constructor() {
            this.ctx = null;
            this.bgmTimer = null;
            this.bgmPlaying = false;
        }

        initContext() {
            if (!this.ctx) {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (this.ctx.state === 'suspended') {
                this.ctx.resume();
            }
        }

        playDing() {
            this.initContext();
            const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1046.50, this.ctx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(); osc.stop(this.ctx.currentTime + 0.3);
        }

        playBuzz() {
            this.initContext();
            const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(160, this.ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(90, this.ctx.currentTime + 0.35);
            gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(); osc.stop(this.ctx.currentTime + 0.35);
        }

        playFanfare() {
            this.initContext();
            const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99];
            notes.forEach((freq, idx) => {
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime + idx * 0.08);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.08 + 0.2);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(this.ctx.currentTime + idx * 0.08);
                osc.stop(this.ctx.currentTime + idx * 0.08 + 0.2);
            });
        }

        playTick() {
            this.initContext();
            const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, this.ctx.currentTime);
            gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(); osc.stop(this.ctx.currentTime + 0.05);
        }

        toggleBGM() {
            this.initContext();
            const btn = document.getElementById('bgm-btn');
            if (this.bgmPlaying) {
                this.stopBGM();
                btn.innerText = "🔇 BGM: 关";
                btn.style.borderColor = "var(--accent-yellow)";
            } else {
                this.startBGM();
                btn.innerText = "🎵 BGM: 开";
                btn.style.borderColor = "var(--accent-green)";
            }
        }

        startBGM() {
            if (this.bgmPlaying) return;
            this.bgmPlaying = true;
            
            const notes = [
                261.63, 329.63, 392.00, 329.63, 293.66, 349.23, 440.00, 349.23,
                329.63, 392.00, 523.25, 392.00, 293.66, 349.23, 392.00, 293.66
            ];
            let step = 0;

            this.bgmTimer = setInterval(() => {
                if (!this.bgmPlaying) return;
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(notes[step], this.ctx.currentTime);
                
                gain.gain.setValueAtTime(0.02, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.2);
                
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.2);

                step = (step + 1) % notes.length;
            }, 250);
        }

        stopBGM() {
            this.bgmPlaying = false;
            if (this.bgmTimer) {
                clearInterval(this.bgmTimer);
                this.bgmTimer = null;
            }
        }
    }

    const soundAudio = new SoundEngine();

    function speakText(text) {
        if (!teacherConfig.voiceEnabled) return;
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'zh-CN';
            msg.rate = 0.95;
            window.speechSynthesis.speak(msg);
        }
    }
</script>

        endTime: null
    };
    let googleSheetSent = false;

    function showScreen(screenId) {
        document.querySelectorAll('.view-screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function openTeacherDashboard() { 
        soundAudio.playTick();
        document.getElementById('modal-teacher').classList.add('active'); 
    }
    function closeTeacherDashboard() {
        soundAudio.playTick();
        const radios = document.getElementsByName('vs-mode');
        radios.forEach(r => { if(r.checked) teacherConfig.visualMode = r.value; });
        teacherConfig.voiceEnabled = document.getElementById('cfg-voice').checked;
        document.getElementById('modal-teacher').classList.remove('active');
    }

    function updateHUD() {
        document.getElementById('hud-coins').innerText = playerData.coins;
        document.getElementById('hud-keys').innerText = `${playerData.keys}/2`;
        document.getElementById('hud-crystals').innerText = `${playerData.crystals}/2`;
    }

    function startGame() {
        soundAudio.playTick();
        playerData.name = document.getElementById('input-name').value.trim() || "小明";
        playerData.school = document.getElementById('input-school').value.trim() || "华小";
        playerData.className = document.getElementById('input-class').value.trim() || "4A";
        playerData.voice = document.getElementById('voice-gender').value;

        document.getElementById('hud-name').innerText = playerData.name;
        document.getElementById('ai-avatar').innerText = playerData.voice === 'female' ? '👩‍🏫' : '👨‍🏫';

        stats.startTime = new Date();
        showScreen('screen-game');
        loadStage(1);
    }

    function loadStage(stageNum) {
        currentStage = stageNum;
        currentQIndex = 0;
        stageQuestions = questionBank[`stage${stageNum}`];
        loadQuestion();
    }

    function loadQuestion() {
        wrongAttemptsForCurrentQ = 0;
        currentAiLevel = (teacherConfig.visualMode === 'always') ? 3 : (teacherConfig.visualMode === 'off' ? 1 : 1);
        microLearningSubStep = 0;
        vStep = 0;

        currentQuestion = stageQuestions[currentQIndex];

        document.getElementById('level-indicator').innerText = `${currentQIndex + 1}/${stageQuestions.length}`;
        document.getElementById('q-text').innerText = `${currentQIndex + 1}. ${currentQuestion.q}`;

        renderOptions(currentQuestion.opts, currentQuestion.a);
        updateAiLevelUI();
    }

    function renderOptions(optionsArr, correctAns) {
        const optionsGrid = document.getElementById('options-grid');
        optionsGrid.innerHTML = '';
        const shuffled = [...optionsArr].sort(() => Math.random() - 0.5);

        shuffled.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'btn-opt';
            btn.innerText = `${String.fromCharCode(65 + i)}. ${opt}`;
            btn.onclick = () => handleAnswer(opt, correctAns);
            optionsGrid.appendChild(btn);
        });
    }

    function handleAnswer(selectedOpt, targetAns) {
        stats.totalAnswered++;

        if (selectedOpt === targetAns) {
            soundAudio.playDing();

            if (currentAiLevel === 5 && microLearningSubStep < 3) {
                microLearningSubStep++;
                runLevelMicroLearning();
                return;
            }

            if (wrongAttemptsForCurrentQ === 0) {
                stats.correctFirstTry++;
                if (currentStage === 1) stats.stage1CorrectFirst++;
                if (currentStage === 2) stats.stage2CorrectFirst++;
            }
            playerData.coins += 10;
            updateHUD();

            currentQIndex++;
            if (currentQIndex < stageQuestions.length) {
                loadQuestion();
            } else {
                finishStage();
            }
        } else {
            soundAudio.playBuzz();
            wrongAttemptsForCurrentQ++;
            stats.aiHelpsCount++;

            document.getElementById('app-container').classList.add('shake');
            setTimeout(() => document.getElementById('app-container').classList.remove('shake'), 400);

            if (teacherConfig.visualMode === 'auto') {
                currentAiLevel = Math.min(5, wrongAttemptsForCurrentQ + 1);
            }

            if (currentAiLevel > stats.levelReachMax) stats.levelReachMax = currentAiLevel;
            updateAiLevelUI();
        }
    }

    function updateAiLevelUI() {
        const badge = document.getElementById('ai-level-badge');
        const speech = document.getElementById('ai-speech');
        const workspace = document.getElementById('visual-workspace');

        workspace.classList.remove('active');
        workspace.innerHTML = '';

        const n1 = currentQuestion.n1;
        const n2 = currentQuestion.n2;

        if (currentAiLevel === 1) {
            badge.className = "ai-level-badge lvl-1";
            badge.innerText = "🟢 Level 1：独立挑战";
            speech.innerText = "请独立完成这道减法题，加油！";
            speakText(speech.innerText);
        }
        else if (currentAiLevel === 2) {
            badge.className = "ai-level-badge lvl-2";
            badge.innerText = "🟡 Level 2：数位与借位填空";
            speech.innerText = "如果不够减，点击【自动计算借位】或自行借位，再填下方的差！";
            speakText(speech.innerText);

            workspace.classList.add('active');
            renderPlaceValueHouse(n1, n2);
        }
        else if (currentAiLevel === 3) {
            badge.className = "ai-level-badge lvl-3";
            badge.innerText = "🔵 Level 3：积木辅助";
            speech.innerText = "老师用十进位积木展示减去的数量，仔细观察！";
            speakText(speech.innerText);

            workspace.classList.add('active');
            renderBaseTenBlocks(n1, n2);
        }
        else if (currentAiLevel === 4) {
            badge.className = "ai-level-badge lvl-5";
            badge.innerText = "🟣 Level 4：分步减法竖式讲解";
            vStep = 0;
            workspace.classList.add('active');
            renderVerticalMethodDemo(n1, n2);
        }
        else if (currentAiLevel === 5) {
            badge.className = "ai-level-badge lvl-5";
            badge.innerText = "🔴 Level 5：拆解微学习";
            runLevelMicroLearning();
        }
    }

    /* Level 2: 减法数位与借位表 (修改：精准DOM标签包裹) */
    function renderPlaceValueHouse(n1, n2) {
        const s1 = n1.toString().padStart(4, '0').split('').map(Number);
        const s2 = n2.toString().padStart(4, '0').split('').map(Number);
        const cols = ['th', 'hu', 'te', 'on'];
        const colNames = ['千位', '百位', '十位', '个位'];

        let html = `
            <div style="display:flex; flex-direction:column; align-items:center; gap:10px; width:100%;">
                <div class="place-value-house">
        `;

        for (let i = 0; i < 4; i++) {
            html += `
                <div class="pv-col">
                    <div class="pv-header">${colNames[i]}</div>
                    <div class="pv-borrow-box">
                        <input type="text" class="borrow-input" id="bw-${cols[i]}" maxlength="2" placeholder="顶" oninput="onBorrowInput(${i})">
                    </div>
                    <div class="pv-val">
                        <span id="num1-${cols[i]}" class="pv-num1">${s1[i]}</span><br>
                        <span class="pv-minus">-</span><br>
                        <span class="pv-num2">${s2[i]}</span>
                    </div>
                    <input type="text" class="pv-input" id="pv-in-${cols[i]}" maxlength="1" placeholder="?">
                </div>
            `;
        }

        html += `
                </div>
                <div style="display:flex; gap:10px; margin-top:5px;">
                    <button class="btn-action" style="max-width:200px; padding:8px 15px; font-size:18px; background:linear-gradient(180deg, #ffaa00 0%, #cc7700 100%);" onclick="autoCalculateBorrows()">
                        🪄 自动计算借位
                    </button>
                    <button class="btn-action" style="max-width:240px; padding:8px 15px; font-size:18px;" onclick="checkPlaceValueInputs()">
                        ✍️ 提交答案
                    </button>
                </div>
            </div>
        `;

        document.getElementById('visual-workspace').innerHTML = html;
    }

    function onBorrowInput(colIdx) {
        soundAudio.playTick();
        const cols = ['th', 'hu', 'te', 'on'];
        const numElem = document.getElementById(`num1-${cols[colIdx]}`);
        const bwElem = document.getElementById(`bw-${cols[colIdx]}`);

        if (bwElem.value.trim() !== "") {
            if(numElem) numElem.classList.add('strikethrough');
        } else {
            if(numElem) numElem.classList.remove('strikethrough');
        }
    }

    /* 修复后的借位算法逻辑 */
    function autoCalculateBorrows() {
        soundAudio.playTick();
        const n1 = currentQuestion.n1;
        const n2 = currentQuestion.n2;
        const s1 = n1.toString().padStart(4, '0').split('').map(Number);
        const s2 = n2.toString().padStart(4, '0').split('').map(Number);
        const cols = ['th', 'hu', 'te', 'on'];

        let currentVal = [...s1];

        // 从个位 (i=3) 到千位 (i=0) 依次处理借位
        for (let i = 3; i >= 0; i--) {
            if (currentVal[i] < s2[i]) {
                if (i > 0) {
                    currentVal[i] += 10;
                    currentVal[i - 1] -= 1;
                }
            }
        }

        // 更新各列UI
        for (let i = 0; i < 4; i++) {
            const bwElem = document.getElementById(`bw-${cols[i]}`);
            const numElem = document.getElementById(`num1-${cols[i]}`);
            
            if (currentVal[i] !== s1[i]) {
                bwElem.value = currentVal[i];
                if (numElem) numElem.classList.add('strikethrough');
            } else {
                bwElem.value = '';
                if (numElem) numElem.classList.remove('strikethrough');
            }
        }
    }

    function checkPlaceValueInputs() {
        const cols = ['th', 'hu', 'te', 'on'];
        let resStr = "";
        for (let i = 0; i < 4; i++) {
            resStr += document.getElementById(`pv-in-${cols[i]}`).value.trim();
        }
        if (parseInt(resStr) === currentQuestion.a) {
            handleAnswer(currentQuestion.a, currentQuestion.a);
        } else {
            soundAudio.playBuzz();
            alert("填写的数值不正确，再仔细算算看！");
        }
    }

    /* Level 3: 积木辅助 */
    function renderBaseTenBlocks(n1, n2) {
        const s1 = n1.toString().padStart(4, '0').split('').map(Number);
        const s2 = n2.toString().padStart(4, '0').split('').map(Number);

        let html = `<div class="blocks-container">`;
        const labels = ['千位积木 (1000)', '百位积木 (100)', '十位积木 (10)', '个位积木 (1)'];
        const counts = [s1[0], s1[1], s1[2], s1[3]];
        const minus = [s2[0], s2[1], s2[2], s2[3]];
        const cssClass = ['b-thousand', 'b-hundred', 'b-ten', 'b-one'];

        for (let i = 0; i < 4; i++) {
            html += `
                <div class="block-row">
                    <div class="block-label">${labels[i]}</div>
                    <div class="block-group">
            `;
            for (let c = 0; c < counts[i]; c++) {
                const isCrossed = c >= (counts[i] - minus[i]);
                const opacityStyle = isCrossed ? 'opacity:0.25; filter:grayscale(100%);' : '';
                html += `<div class="${cssClass[i]}" style="${opacityStyle}">${cssClass[i] === 'b-thousand' ? '1000' : ''}</div>`;
            }
            html += `
                    </div>
                </div>
            `;
        }
        html += `</div>`;
        document.getElementById('visual-workspace').innerHTML = html;
    }

    /* Level 4: 分步减法竖式 */
    function renderVerticalMethodDemo(n1, n2) {
        const speech = document.getElementById('ai-speech');
        const workspace = document.getElementById('visual-workspace');

        const steps = [
            `第一步：从个位减起...`,
            `第二步：算十位...`,
            `第三步：算百位...`,
            `第四步：算千位，最终答案是 ${currentQuestion.a}！`
        ];

        speech.innerText = steps[vStep];
        speakText(speech.innerText);

        workspace.innerHTML = `
            <div style="display:flex; flex-direction:column; align-items:center;">
                <div class="v-board-5">
                    <div class="v-borrow-row">  .  .</div>
                    <div> ${n1}</div>
                    <div>-${n2}</div>
                    <div style="border-top:4px solid #fff; margin-top:5px; padding-top:5px; color:var(--accent-yellow);">
                        ${currentQuestion.a}
                    </div>
                </div>
                <button class="btn-action" style="margin-top:15px; width:200px;" onclick="nextVStep()">下一步 ➔</button>
            </div>
        `;
    }

    function nextVStep() {
        soundAudio.playTick();
        vStep = (vStep + 1) % 4;
        renderVerticalMethodDemo(currentQuestion.n1, currentQuestion.n2);
    }

    /* Level 5: 拆解微学习 */
    function runLevelMicroLearning() {
        const workspace = document.getElementById('visual-workspace');
        workspace.classList.add('active');

        const speech = document.getElementById('ai-speech');
        const s1 = currentQuestion.n1.toString().padStart(4, '0').split('').map(Number);
        const s2 = currentQuestion.n2.toString().padStart(4, '0').split('').map(Number);

        if (microLearningSubStep === 0) {
            speech.innerText = `微学习 Step 1：请先计算个位 ${s1[3]} - ${s2[3]} 的结果！`;
            speakText(speech.innerText);
            renderOptions([(s1[3] - s2[3] + 10) % 10, Math.abs(s1[3] - s2[3]), s1[3] + s2[3], 0], (s1[3] - s2[3] + 10) % 10);
        } else if (microLearningSubStep === 1) {
            speech.innerText = `微学习 Step 2：接着计算十位减法！`;
            speakText(speech.innerText);
            renderOptions([Math.abs(s1[2] - s2[2]), (s1[2] - s2[2] + 10) % 10, 5, 2], (s1[2] - s2[2] + 10) % 10);
        } else if (microLearningSubStep === 2) {
            speech.innerText = `微学习 Step 3：很好！现在计算百位与千位减法！`;
            speakText(speech.innerText);
            renderOptions([currentQuestion.a, currentQuestion.a + 100, currentQuestion.a - 10, currentQuestion.a + 10], currentQuestion.a);
        }
    }

    /* 阶段通关逻辑 */
    function finishStage() {
        soundAudio.playFanfare();
        if (currentStage === 1) {
            playerData.keys = 2;
            updateHUD();
            showScreen('screen-chest');
        } else {
            playerData.crystals = 2;
            updateHUD();
            showReport();
        }
    }

    function nextStage() {
        soundAudio.playTick();
        showScreen('screen-game');
        loadStage(2);
    }

    /* Google Sheet 自动发送：Tolak 减法 */
    const GOOGLE_SHEET_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyaefhPVRxy5eXafgVvHC5NQvyI4CdD70D2PgwAncGsEgFAaFUMP13_6dMn0RRy-CUv/exec";

    function sendDataToGoogleSheet(duration) {
        if (googleSheetSent) return;
        googleSheetSent = true;

        const payload = {
            name: playerData.name,
            className: playerData.className,
            school: playerData.school,

            // Level 1 / Level 2：每关5题，记录首次独立答对数量
            digitalL1: stats.stage1CorrectFirst,
            digitalL1TP: stats.stage1CorrectFirst >= 2 ? "TP3" : "未达TP3",

            digitalL2: stats.stage2CorrectFirst,
            digitalL2TP: stats.stage2CorrectFirst >= 2 ? "TP3" : "未达TP3",

            digitalTP3: (stats.stage1CorrectFirst >= 2 && stats.stage2CorrectFirst >= 2) ? 2 :
                        ((stats.stage1CorrectFirst >= 2 || stats.stage2CorrectFirst >= 2) ? 1 : 0),

            aiHelp: stats.aiHelpsCount,
            digitalTime: Math.floor(duration / 60) + "分" + (duration % 60) + "秒",

            // 减法游戏目前没有在游戏内进行 Post-Test，因此留空
            postL1: "",
            postL1TP: "",
            postL2: "",
            postL2TP: "",
            postTP3: ""
        };

        fetch(GOOGLE_SHEET_WEB_APP_URL, {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "text/plain;charset=UTF-8"
            },
            body: JSON.stringify(payload)
        }).catch(error => {
            console.error("Google Sheet 发送失败：", error);
            googleSheetSent = false;
        });
    }

    /* 诊断报告 */
    function showReport() {
        stats.endTime = new Date();
        const duration = Math.round((stats.endTime - stats.startTime) / 1000);

        // 游戏结束后自动发送到 Google Sheet
        sendDataToGoogleSheet(duration);

        showScreen('screen-report');
        const reportContent = document.getElementById('report-content');

        reportContent.innerHTML = `
            <div class="report-item"><span>👤 学生姓名：</span><strong>${playerData.name}</strong></div>
            <div class="report-item"><span>🏫 学校班级：</span><strong>${playerData.school} - ${playerData.className}</strong></div>
            <div class="report-item"><span>⏱ 答题用时：</span><strong>${duration} 秒</strong></div>
            <div class="report-item"><span>🎯 首次做对题数：</span><strong>${stats.correctFirstTry} / ${stats.totalAnswered}</strong></div>
            <div class="report-item"><span>💡 AI 启发与辅助次数：</span><strong>${stats.aiHelpsCount} 次</strong></div>
            <div class="report-item"><span>📊 触及最高 AI 阶梯：</span><strong>Level ${stats.levelReachMax}</strong></div>
            <div class="report-item"><span>📗 Google Sheet：</span><strong style="color:#00ff66;">✅ 已发送</strong></div>
            <div class="report-item" style="border:none; margin-top:10px;">
                <span style="color:var(--accent-yellow);">🌟 综合学习评价：</span>
                <strong>${stats.correctFirstTry > 6 ? '减法大师！理解非常迅速！' : '表现棒！在 AI 引导下成功掌握了退位减法技巧！'}</strong>
            </div>
        `;
    }
</script>

</body>
</html>
