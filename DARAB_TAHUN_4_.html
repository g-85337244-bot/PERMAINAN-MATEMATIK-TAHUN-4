<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏰 数学逃脱密室 - 四年级乘法特别版</title>
    <style>
        :root {
            --bg-bright: linear-gradient(135deg, #1b2a47 0%, #4663ac 100%);
            --card-main: #1c2b53;
            --accent-yellow: #ffea00;
            --accent-green: #00ff66;
            --accent-cyan: #00f0ff;
            --accent-pink: #ff2a8d;
            --text-light: #ffffff;
        }

        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }

        body {
            font-family: 'Comic Sans MS', 'Segoe UI', sans-serif;
            background: var(--bg-bright);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .app-container {
            width: 100%;
            max-width: 980px;
            background: rgba(20, 32, 65, 0.95);
            border-radius: 32px;
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.5), inset 0 0 15px rgba(255, 255, 255, 0.2);
            border: 5px solid var(--accent-cyan);
            overflow: hidden;
            position: relative;
            min-height: 720px;
            display: flex;
            flex-direction: column;
        }

        .bgm-toggle-btn {
            position: absolute;
            top: 15px; right: 15px; z-index: 100;
            background: rgba(0, 0, 0, 0.6); border: 2px solid var(--accent-yellow);
            color: #fff; font-size: 20px; padding: 6px 12px; border-radius: 20px;
            cursor: pointer; transition: all 0.2s;
        }
        .bgm-toggle-btn:hover { transform: scale(1.05); }

        .shake { animation: shakeAnim 0.4s ease-in-out; }
        @keyframes shakeAnim {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-12px); }
            40%, 80% { transform: translateX(12px); }
        }

        .view-screen {
            display: none; padding: 25px; flex: 1; flex-direction: column;
            justify-content: space-between; animation: fadeIn 0.25s ease-out;
        }
        .view-screen.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }

        .player-hud {
            display: flex; justify-content: space-between; align-items: center;
            background: #ff0055; padding: 12px 24px; border-radius: 20px;
            border: 3px solid var(--accent-yellow); font-size: 22px; font-weight: 900;
            box-shadow: 0 6px 0 #990033; text-shadow: 1px 1px 2px #000; margin-right: 60px;
        }

        .level-indicator-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: #0088ff; padding: 10px 20px; border-radius: 16px; margin: 15px 0;
            border: 3px solid #ffffff; font-size: 20px; font-weight: bold; box-shadow: 0 4px 0 #0055aa;
        }

        .ai-level-badge {
            padding: 6px 18px; border-radius: 30px; font-weight: 900; font-size: 18px;
            display: inline-flex; align-items: center; gap: 6px; text-shadow: 1px 1px 2px #000;
        }
        .lvl-1 { background: #00cc44; border: 2px solid #ffffff; }
        .lvl-2 { background: #ffaa00; border: 2px solid #ffffff; }

        .q-card {
            background: linear-gradient(180deg, #ff0055 0%, #aa0033 100%); 
            border-radius: 24px; padding: 20px; text-align: center;
            border: 5px solid var(--accent-yellow); margin-bottom: 15px; box-shadow: 0 8px 0 #660022;
        }
        .q-text { font-size: 40px; font-weight: 900; color: #ffffff; letter-spacing: 2px; text-shadow: 3px 3px 0px #000; }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn-opt {
            background: linear-gradient(180deg, #00f0ff 0%, #0088ff 100%);
            border: 4px solid #ffffff; color: #ffffff; font-size: 30px; font-weight: 900;
            padding: 15px; border-radius: 20px; cursor: pointer; text-shadow: 2px 2px 0px #000;
            box-shadow: 0 8px 0 #0044aa; transition: all 0.1s;
        }
        .btn-opt:active { transform: translateY(4px); box-shadow: 0 4px 0 #0044aa; }

        .btn-action {
            background: linear-gradient(180deg, #00ff66 0%, #00aa33 100%); color: white; border: 4px solid #ffffff;
            padding: 14px 28px; font-size: 22px; font-weight: 900; border-radius: 20px; cursor: pointer;
            box-shadow: 0 6px 0 #006622; text-shadow: 1px 1px 2px #000; transition: all 0.1s; width: 100%;
        }

        .visual-workspace {
            display: none; background: #0f1a30; border-radius: 20px; border: 4px solid var(--accent-cyan);
            padding: 15px; margin-bottom: 15px; min-height: 220px; position: relative;
            flex-direction: column; justify-content: center; align-items: center;
        }
        .visual-workspace.active { display: flex; }

        .place-value-house { 
            display: flex; gap: 8px; justify-content: center; align-items: stretch; width: 100%; max-width: 880px; 
        }
        .pv-col-op {
            width: 30px; display: flex; flex-direction: column; justify-content: flex-start;
            align-items: center; font-size: 36px; font-weight: 900; color: var(--accent-cyan);
            padding-top: 105px; line-height: 1;
        }
        .pv-col {
            flex: 1; background: #1a3366; border-radius: 16px; border: 3px solid var(--accent-yellow);
            text-align: center; overflow: hidden; display: flex; flex-direction: column; padding-bottom: 8px;
        }
        .pv-header { background: #0055aa; padding: 6px 2px; font-weight: 900; font-size: 17px; color: var(--accent-yellow); }
        
        /* 💡 包含【个位乘法进位框】与【十位乘法进位框】 */
        .pv-borrow-box { 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            margin: 3px auto; gap: 3px;
        }
        
        /* 个位乘法进位（红粉虚线） */
        .borrow-input {
            width: 32px; height: 24px; text-align: center; background: #ffe6f0; border: 2px dashed var(--accent-pink);
            color: #d80058; font-size: 15px; font-weight: 900; border-radius: 6px; outline: none;
        }
        /* 十位乘法进位（橙黄虚线） */
        .borrow-input-tens {
            width: 32px; height: 24px; text-align: center; background: #fffbe6; border: 2px dashed var(--accent-yellow);
            color: #d87700; font-size: 15px; font-weight: 900; border-radius: 6px; outline: none;
        }

        /* 加法进位框（蓝虚线，纯空白） */
        .add-carry-input {
            width: 32px; height: 24px; text-align: center; background: #e6ffff; border: 2px dashed var(--accent-cyan);
            color: #0088cc; font-size: 15px; font-weight: 900; border-radius: 6px; outline: none; margin: 4px auto 2px auto;
        }

        .pv-val { 
            padding: 4px 0; font-size: 30px; font-weight: 900; border-bottom: 3px solid var(--accent-yellow);
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2px;
        }
        .pv-num1 { min-height: 34px; color: #fff; }
        .pv-num2 { min-height: 34px; color: var(--accent-cyan); }

        .pv-inputs-group { display: flex; flex-direction: column; gap: 5px; padding: 5px 3px 0 3px; }
        .pv-input {
            width: 100%; text-align: center; background: #ffffff; border: 2px solid var(--accent-cyan);
            color: #000000; font-size: 24px; font-weight: 900; border-radius: 8px; padding: 2px 0; outline: none;
        }
        .pv-input.auto-zero {
            background: #e0e0e0; color: #666666; border-color: #aaaaaa; cursor: not-allowed;
        }
        .pv-input.final-row { border-color: var(--accent-yellow); background: #fffbe6; }

        .ai-speech-box { display: flex; align-items: center; gap: 15px; background: #004488; padding: 12px 20px; border-radius: 18px; border: 3px solid var(--accent-yellow); margin-bottom: 12px; }
        .modal-overlay { display: none; position: absolute; inset: 0; background: rgba(10, 15, 30, 0.95); z-index: 200; padding: 25px; flex-direction: column; justify-content: space-between; }
        .modal-overlay.active { display: flex; }
        .config-group label { display: flex; align-items: center; gap: 10px; font-size: 20px; color: var(--text-light); cursor: pointer; margin-bottom: 15px; }
        .report-box { background: #0e1a35; padding: 20px; border-radius: 16px; font-size: 18px; border: 3px solid var(--accent-cyan); }
        .report-item { display: flex; justify-content: space-between; border-bottom: 2px dashed #0055aa; padding: 10px 0; }
    </style>
</head>
<body>

</div>

<script>
    class SoundEngine {
        constructor() {
            this.ctx = null;
            this.bgmTimer = null;
            this.bgmPlaying = false;
        }

        initContext() {
            if (!this.ctx) {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (this.ctx.state === 'suspended') {
                this.ctx.resume();
            }
        }

        playDing() {
            this.initContext();
            const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1046.50, this.ctx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(); osc.stop(this.ctx.currentTime + 0.3);
        }

        playBuzz() {
            this.initContext();
            const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(160, this.ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(90, this.ctx.currentTime + 0.35);
            gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(); osc.stop(this.ctx.currentTime + 0.35);
        }

        playTick() {
            this.initContext();
            const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, this.ctx.currentTime);
            gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(); osc.stop(this.ctx.currentTime + 0.05);
        }

        toggleBGM() {
            this.initContext();
            const btn = document.getElementById('bgm-btn');
            if (this.bgmPlaying) {
                this.stopBGM();
                btn.innerText = "🔇 BGM: 关";
                btn.style.borderColor = "var(--accent-yellow)";
            } else {
                this.startBGM();
                btn.innerText = "🎵 BGM: 开";
                btn.style.borderColor = "var(--accent-green)";
            }
        }

        startBGM() {
            if (this.bgmPlaying) return;
            this.bgmPlaying = true;
            
            const notes = [
                261.63, 329.63, 392.00, 329.63, 293.66, 349.23, 440.00, 349.23,
                329.63, 392.00, 523.25, 392.00, 293.66, 349.23, 392.00, 293.66
            ];
            let step = 0;

            this.bgmTimer = setInterval(() => {
                if (!this.bgmPlaying) return;
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(notes[step], this.ctx.currentTime);
                gain.gain.setValueAtTime(0.02, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.2);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.2);
                step = (step + 1) % notes.length;
            }, 250);
        }

        stopBGM() {
            this.bgmPlaying = false;
            if (this.bgmTimer) {
                clearInterval(this.bgmTimer);
                this.bgmTimer = null;
            }
        }
    }

    const soundAudio = new SoundEngine();

    function speakText(text) {
        if (!teacherConfig.voiceEnabled) return;
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'zh-CN';
            msg.rate = 0.95;
            window.speechSynthesis.speak(msg);
        }
    }
</script>

<script>
    const questionBank = {
        stage1: [
            { q: "142 × 3 = ?", a: 426, opts: [426, 416, 436, 326], n1: 142, n2: 3 },
            { q: "214 × 4 = ?", a: 856, opts: [856, 846, 816, 866], n1: 214, n2: 4 },
            { q: "308 × 5 = ?", a: 1540, opts: [1540, 1500, 1530, 1640], n1: 308, n2: 5 },
            { q: "520 × 6 = ?", a: 3120, opts: [3120, 3100, 3220, 3020], n1: 520, n2: 6 },
            { q: "413 × 7 = ?", a: 2891, opts: [2891, 2881, 2821, 2991], n1: 413, n2: 7 }
        ],
        stage2: [
            { q: "34 × 21 = ?", a: 714, opts: [714, 724, 614, 704], n1: 34, n2: 21 },
            { q: "23 × 12 = ?", a: 276, opts: [276, 266, 286, 256], n1: 23, n2: 12 },
            { q: "45 × 16 = ?", a: 720, opts: [720, 710, 730, 680], n1: 45, n2: 16 },
            { q: "52 × 34 = ?", a: 1768, opts: [1768, 1758, 1778, 1668], n1: 52, n2: 34 },
            { q: "68 × 45 = ?", a: 3060, opts: [3060, 3050, 2960, 3160], n1: 68, n2: 45 }
        ]
    };

    let playerData = { name: '', school: '', className: '', voice: 'female', coins: 0, keys: 0, crystals: 0 };
    let teacherConfig = { visualMode: 'auto', voiceEnabled: true };

    let currentStage = 1;
    let currentQIndex = 0;
    let stageQuestions = [];
    let currentQuestion = null;

    let currentAiLevel = 1;
    let wrongAttemptsForCurrentQ = 0;

    let stats = {
        totalAnswered: 0,
        correctFirstTry: 0,
        aiHelpsCount: 0,
        levelReachMax: 1,
        startTime: null,
        endTime: null,
        stage1CorrectFirstTry: 0,
        stage2CorrectFirstTry: 0
    };

    // ===== DME Tahun 4 - Google Sheet =====
    // 乘法：Level 1 = 前5题，Level 2 = 后5题
    const GOOGLE_SHEET_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyVqpHbXnSmN7S_nzwoftIzv-zLlByOAdCAsc1fc9YEpZTT4J76EdGRqVenHQIxO_b_/exec";
    let googleSheetSent = false;
    let googleSheetStatus = "尚未发送";

    function showScreen(screenId) {
        document.querySelectorAll('.view-screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function openTeacherDashboard() { 
        soundAudio.playTick();
        document.getElementById('modal-teacher').classList.add('active'); 
    }
    function closeTeacherDashboard() {
        soundAudio.playTick();
        const radios = document.getElementsByName('vs-mode');
        radios.forEach(r => { if(r.checked) teacherConfig.visualMode = r.value; });
        teacherConfig.voiceEnabled = document.getElementById('cfg-voice').checked;
        document.getElementById('modal-teacher').classList.remove('active');
    }

    function updateHUD() {
        document.getElementById('hud-coins').innerText = playerData.coins;
        document.getElementById('hud-keys').innerText = `${playerData.keys}/2`;
        document.getElementById('hud-crystals').innerText = `${playerData.crystals}/2`;
    }

    function startGame() {
        soundAudio.playTick();
        playerData.name = document.getElementById('input-name').value.trim() || "小明";
        playerData.school = document.getElementById('input-school').value.trim() || "华小";
        playerData.className = document.getElementById('input-class').value.trim() || "4A";
        playerData.voice = document.getElementById('voice-gender').value;

        document.getElementById('hud-name').innerText = playerData.name;
        document.getElementById('ai-avatar').innerText = playerData.voice === 'female' ? '👩‍🏫' : '👨‍🏫';

        stats.startTime = new Date();
        showScreen('screen-game');
        loadStage(1);
    }

    function loadStage(stageNum) {
        currentStage = stageNum;
        currentQIndex = 0;
        stageQuestions = questionBank[`stage${stageNum}`];
        loadQuestion();
    }

    function loadQuestion() {
        wrongAttemptsForCurrentQ = 0;
        currentAiLevel = (teacherConfig.visualMode === 'always') ? 2 : 1;

        currentQuestion = stageQuestions[currentQIndex];

        document.getElementById('level-indicator').innerText = `${currentQIndex + 1}/${stageQuestions.length}`;
        document.getElementById('q-text').innerText = `${currentQIndex + 1}. ${currentQuestion.q}`;

        renderOptions(currentQuestion.opts, currentQuestion.a);
        updateAiLevelUI();
    }

    function renderOptions(optionsArr, correctAns) {
        const optionsGrid = document.getElementById('options-grid');
        optionsGrid.innerHTML = '';
        const shuffled = [...optionsArr].sort(() => Math.random() - 0.5);

        shuffled.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'btn-opt';
            btn.innerText = `${String.fromCharCode(65 + i)}. ${opt}`;
            btn.onclick = () => handleAnswer(opt, correctAns);
            optionsGrid.appendChild(btn);
        });
    }

    function handleAnswer(selectedOpt, targetAns) {
        stats.totalAnswered++;

        if (selectedOpt === targetAns) {
            soundAudio.playDing();

            if (wrongAttemptsForCurrentQ === 0) {
                stats.correctFirstTry++;

                if (currentStage === 1) {
                    stats.stage1CorrectFirstTry++;
                } else if (currentStage === 2) {
                    stats.stage2CorrectFirstTry++;
                }
            }

            playerData.coins += 10;
            updateHUD();

            currentQIndex++;
            if (currentQIndex < stageQuestions.length) {
                loadQuestion();
            } else {
                finishStage();
            }
        } else {
            soundAudio.playBuzz();
            wrongAttemptsForCurrentQ++;
            stats.aiHelpsCount++;

            document.getElementById('app-container').classList.add('shake');
            setTimeout(() => document.getElementById('app-container').classList.remove('shake'), 400);

            if (teacherConfig.visualMode === 'auto') {
                currentAiLevel = Math.min(2, wrongAttemptsForCurrentQ + 1);
            }

            if (currentAiLevel > stats.levelReachMax) stats.levelReachMax = currentAiLevel;
            updateAiLevelUI();
        }
    }

    function updateAiLevelUI() {
        const badge = document.getElementById('ai-level-badge');
        const speech = document.getElementById('ai-speech');
        const workspace = document.getElementById('visual-workspace');

        workspace.classList.remove('active');
        workspace.innerHTML = '';

        const n1 = currentQuestion.n1;
        const n2 = currentQuestion.n2;

        if (currentAiLevel === 1) {
            badge.className = "ai-level-badge lvl-1";
            badge.innerText = "🟢 Level 1：独立挑战";
            speech.innerText = "请独立计算这道乘法题目，加油！";
            speakText(speech.innerText);
        }
        else if (currentAiLevel >= 2) {
            badge.className = "ai-level-badge lvl-2";
            badge.innerText = "🟡 Level 2：标准竖式助手";
            speech.innerText = n2 >= 10 
                ? "粉框填个位乘法进位，黄框填十位乘法进位，蓝框填加法进位！" 
                : "注意位数对齐，按个位、十位逐位计算！";
            speakText(speech.innerText);

            workspace.classList.add('active');
            renderPlaceValueHouse(n1, n2);
        }
    }

    function renderPlaceValueHouse(n1, n2) {
        const isTwoDigitMul = n2 >= 10;
        const targetAns = (n1 * n2).toString();
        const numCols = Math.max(targetAns.length, 3); 
        const colNamesAll = ['千位', '百位', '十位', '个位'];
        const colNames = colNamesAll.slice(4 - numCols);

        const n1Str = n1.toString().padStart(numCols, ' ');
        const n2Str = n2.toString().padStart(numCols, ' ');

        let html = `
            <div style="display:flex; flex-direction:column; align-items:center; gap:8px; width:100%;">
                <div class="place-value-house">
                    <div class="pv-col-op">×</div>
        `;

        for (let i = 0; i < numCols; i++) {
            const charN1 = n1Str[i] !== ' ' ? n1Str[i] : '';
            const charN2 = n2Str[i] !== ' ' ? n2Str[i] : '';
            const isIndividualOnes = (i === numCols - 1);

            html += `
                <div class="pv-col">
                    <div class="pv-header">${colNames[i]}</div>
                    <!-- 💡 顶部提供双层乘法进位框 -->
                    <div class="pv-borrow-box" style="visibility: ${isIndividualOnes ? 'hidden' : 'visible'};">
                        <!-- 第一行乘法进位（粉色） -->
                        <input type="text" class="borrow-input" id="carry-ones-${i}" maxlength="1" placeholder="①">
                        <!-- 第二行乘法进位（黄色）仅在两位数乘法显示 -->
                        ${isTwoDigitMul ? `<input type="text" class="borrow-input-tens" id="carry-tens-${i}" maxlength="1" placeholder="②">` : ''}
                    </div>
                    <div class="pv-val">
                        <span class="pv-num1">${charN1}</span>
                        <span class="pv-num2">${charN2}</span>
                    </div>
                    <div class="pv-inputs-group">
            `;

            if (isTwoDigitMul) {
                if (isIndividualOnes) {
                    html += `
                        <input type="text" class="pv-input row-ones" id="pv-ones-${i}" maxlength="1" placeholder="个">
                        <input type="text" class="pv-input row-tens auto-zero" id="pv-tens-${i}" value="0" readonly>
                        <div style="height:24px; margin: 4px 0 2px 0;"></div>
                        <div style="border-top: 2px solid var(--accent-yellow); margin: 2px 0;"></div>
                        <input type="text" class="pv-input final-row" id="pv-sum-${i}" maxlength="1" placeholder="和">
                    `;
                } else {
                    html += `
                        <input type="text" class="pv-input row-ones" id="pv-ones-${i}" maxlength="1" placeholder="个">
                        <input type="text" class="pv-input row-tens" id="pv-tens-${i}" maxlength="1" placeholder="十">
                        <!-- 纯空白加法进位框 -->
                        <input type="text" class="add-carry-input" id="add-carry-${i}" maxlength="1" placeholder="">
                        <div style="border-top: 2px solid var(--accent-yellow); margin: 2px 0;"></div>
                        <input type="text" class="pv-input final-row" id="pv-sum-${i}" maxlength="1" placeholder="和">
                    `;
                }
            } else {
                html += `
                        <input type="text" class="pv-input final-row" id="pv-in-${i}" maxlength="1" placeholder="?">
                `;
            }

            html += `
                    </div>
                </div>
            `;
        }

        html += `
                </div>
                <div style="display:flex; gap:12px; margin-top:6px;">
                    <button class="btn-action" style="max-width:240px; padding:8px 15px; font-size:18px;" onclick="checkPlaceValueInputs(${numCols}, ${isTwoDigitMul})">
                        ✍️ 提交答案
                    </button>
                </div>
            </div>
        `;

        document.getElementById('visual-workspace').innerHTML = html;
    }

    function checkPlaceValueInputs(numCols, isTwoDigitMul) {
        if (isTwoDigitMul) {
            let sumStr = "";
            for (let i = 0; i < numCols; i++) {
                sumStr += document.getElementById(`pv-sum-${i}`).value.trim();
            }

            if (parseInt(sumStr) === currentQuestion.a) {
                handleAnswer(currentQuestion.a, currentQuestion.a);
            } else {
                soundAudio.playBuzz();
                alert("最终相加的答案不正确，请检查个位乘积与十位乘积是否正确相加！");
            }
        } else {
            let resStr = "";
            for (let i = 0; i < numCols; i++) {
                resStr += document.getElementById(`pv-in-${i}`).value.trim();
            }
            if (parseInt(resStr) === currentQuestion.a) {
                handleAnswer(currentQuestion.a, currentQuestion.a);
            } else {
                soundAudio.playBuzz();
                alert("填写的乘积不正确，再仔细算算看！");
            }
        }
    }

    function finishStage() {
        if (currentStage === 1) {
            playerData.keys = 2;
            playerData.crystals = 1;
            updateHUD();
            showScreen('screen-chest');
        } else {
            showReport();
        }
    }

    function nextStage() {
        showScreen('screen-game');
        loadStage(2);
    }

    function showReport() {
        stats.endTime = new Date();
        const durationSec = Math.round((stats.endTime - stats.startTime) / 1000);

        sendDataToGoogleSheet(durationSec);

        const reportHTML = `
            <div class="report-item"><span>👤 学生姓名:</span> <strong>${playerData.name} (${playerData.className})</strong></div>
            <div class="report-item"><span>⏱ 答题用时:</span> <strong>${durationSec} 秒</strong></div>
            <div class="report-item"><span>🎯 答题总数:</span> <strong>${stats.totalAnswered} 次</strong></div>
            <div class="report-item"><span>🌟 首次直接正确率:</span> <strong>${Math.round((stats.correctFirstTry / 10) * 100)}%</strong></div>
            <div class="report-item"><span>🤖 AI脚手架触发次数:</span> <strong>${stats.aiHelpsCount} 次</strong></div>
            <div class="report-item"><span>📗 Google Sheet:</span> <strong id="google-sheet-status" style="color:var(--accent-green)">${googleSheetStatus}</strong></div>
        `;
        document.getElementById('report-content').innerHTML = reportHTML;
        showScreen('screen-report');
    }

    // =====================================================
    // GOOGLE SHEET - DME TAHUN 4 / DARAB
    // =====================================================
    function sendDataToGoogleSheet(durationSec) {
        if (googleSheetSent) return;

        const l1 = Number(stats.stage1CorrectFirstTry || 0);
        const l2 = Number(stats.stage2CorrectFirstTry || 0);

        const payload = {
            name: playerData.name || "",
            className: playerData.className || "",
            kelas: playerData.className || "",
            operation: "Darab",
            operasi: "Darab",

            preL1: "",
            preL1TP: "",
            preL2: "",
            preL2TP: "",
            preTP3: "",

            digitalL1: l1,
            digitalL1TP: l1 >= 2 ? "TP3" : "Belum TP3",

            digitalL2: l2,
            digitalL2TP: l2 >= 2 ? "TP3" : "Belum TP3",

            digitalTP3: `${(l1 >= 2 ? 1 : 0) + (l2 >= 2 ? 1 : 0)}/2`,

            aiHelp: Number(stats.aiHelpsCount || 0),
            digitalTime: durationSec + " 秒",

            postL1: "",
            postL1TP: "",
            postL2: "",
            postL2TP: "",
            postTP3: ""
        };

        fetch(GOOGLE_SHEET_WEBAPP_URL, {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "text/plain;charset=UTF-8"
            },
            body: JSON.stringify(payload),
            keepalive: true
        })
        .then(() => {
            googleSheetSent = true;
            googleSheetStatus = "✅ 已发送到 Google Sheet";
            const el = document.getElementById("google-sheet-status");
            if (el) el.innerText = googleSheetStatus;
        })
        .catch(error => {
            console.error("Google Sheet 发送失败:", error);
            googleSheetSent = false;
            googleSheetStatus = "⚠️ 发送失败";
            const el = document.getElementById("google-sheet-status");
            if (el) el.innerText = googleSheetStatus;
        });
    }

</script>

</html>
