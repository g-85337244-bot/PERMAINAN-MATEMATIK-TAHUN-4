<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏰 数学逃脱密室 - 智能学习报告版</title>

    <style>
        :root {
            --bg-bright: linear-gradient(135deg, #162447 0%, #1f4068 100%);
            --accent-red: #e43f5a;
            --accent-gold: #ffcc00;
            --accent-cyan: #00e5ff;
            --text-light: #ffffff;
            --cell-size: 46px;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
            background: var(--bg-bright);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .app-container {
            width: 100%;
            max-width: 1000px;
            min-height: 720px;
            background: rgba(10, 25, 55, .96);
            border: 4px solid var(--accent-cyan);
            border-radius: 28px;
            box-shadow:
                0 0 35px rgba(0,229,255,.35),
                inset 0 0 20px rgba(255,255,255,.08);
            overflow: hidden;
            position: relative;
        }

        .view-screen {
            display: none;
            min-height: 720px;
            padding: 25px;
        }

        .view-screen.active {
            display: flex;
            flex-direction: column;
        }

        .top-title {
            text-align: center;
            color: var(--accent-gold);
            font-size: 34px;
            font-weight: 900;
            text-shadow: 3px 3px 0 #000;
            margin-bottom: 15px;
        }

        .subtitle {
            text-align: center;
            color: var(--accent-cyan);
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .panel {
            background: #12264d;
            border: 3px solid var(--accent-gold);
            border-radius: 20px;
            padding: 20px;
        }

        .field {
            margin-bottom: 15px;
        }

        .field label {
            display: block;
            margin-bottom: 7px;
            color: var(--accent-gold);
            font-weight: bold;
            font-size: 18px;
        }

        .field input,
        .field select {
            width: 100%;
            padding: 12px;
            border: 3px solid var(--accent-cyan);
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            color: #000;
            background: #fff;
        }

        .two-fields {
            display: flex;
            gap: 12px;
        }

        .two-fields > div {
            flex: 1;
        }

        .btn {
            width: 100%;
            padding: 14px 20px;
            border-radius: 18px;
            border: 3px solid #fff;
            font-size: 21px;
            font-weight: 900;
            color: #fff;
            cursor: pointer;
            text-shadow: 1px 1px 2px #000;
            box-shadow: 0 6px 0 rgba(0,0,0,.35);
        }

        .btn-green {
            background: linear-gradient(#00dd66,#008f40);
        }

        .btn-blue {
            background: linear-gradient(#00bfff,#0070cc);
        }

        .btn-red {
            background: linear-gradient(#ff5570,#bb1735);
        }

        .btn-gray {
            background: linear-gradient(#777,#444);
        }

        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 rgba(0,0,0,.35);
        }

        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            background: #071b3a;
            border: 3px solid var(--accent-gold);
            border-radius: 18px;
            padding: 12px 18px;
            font-weight: bold;
            font-size: 18px;
        }

        .level-bar {
            margin: 15px 0;
            background: #073d78;
            border: 2px solid var(--accent-cyan);
            border-radius: 15px;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }

        .ai-badge {
            padding: 6px 13px;
            border-radius: 20px;
            font-size: 16px;
        }

        .ai-l1 {
            background: #00a94f;
        }

        .ai-l2 {
            background: #d98b00;
        }

        .speech {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #083665;
            border: 2px solid var(--accent-cyan);
            border-radius: 16px;
            padding: 10px 15px;
            margin-bottom: 15px;
        }

        .avatar {
            font-size: 40px;
        }

        .speech-text {
            font-size: 18px;
            font-weight: bold;
        }

        .question-card {
            background: linear-gradient(#e43f5a,#9f1830);
            border: 4px solid var(--accent-gold);
            border-radius: 22px;
            padding: 22px;
            text-align: center;
            box-shadow: 0 7px 0 #651020;
            margin-bottom: 15px;
        }

        .question-text {
            font-size: 40px;
            font-weight: 900;
            text-shadow: 3px 3px 0 #000;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .option-btn {
            border: 3px solid #fff;
            border-radius: 18px;
            background: linear-gradient(#00cfff,#006bd1);
            color: #fff;
            font-size: 28px;
            font-weight: 900;
            padding: 15px;
            cursor: pointer;
            box-shadow: 0 6px 0 #004b91;
        }

        .option-btn:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #004b91;
        }

        .workspace {
            display: none;
            background: #07152e;
            border: 3px solid var(--accent-cyan);
            border-radius: 18px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .workspace.active {
            display: block;
        }

        .division-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .division-question {
            font-size: 26px;
            font-weight: 900;
            color: var(--accent-gold);
        }

        .helper-input {
            width: 80px;
            padding: 8px;
            text-align: center;
            border-radius: 8px;
            border: 2px solid var(--accent-cyan);
            font-size: 20px;
            font-weight: bold;
        }

        .report-box {
            background: #081a38;
            border: 3px solid var(--accent-cyan);
            border-radius: 18px;
            padding: 18px;
        }

        .report-item {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 11px 0;
            border-bottom: 2px dashed #145493;
            font-size: 18px;
        }

        .sheet-status {
            margin-top: 15px;
            padding: 13px;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
            background: #087a40;
        }

        .sheet-status.error {
            background: #8b2500;
        }

        .chest {
            text-align: center;
            font-size: 90px;
            margin: 25px 0;
        }

        .center {
            text-align: center;
        }

        .shake {
            animation: shake .35s ease;
        }

        @keyframes shake {
            0%,100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-7px); }
        }

        .bgm-btn {
            position: absolute;
            right: 15px;
            top: 15px;
            z-index: 20;
            border: 2px solid var(--accent-gold);
            background: rgba(0,0,0,.55);
            color: #fff;
            border-radius: 20px;
            padding: 7px 12px;
            cursor: pointer;
        }

        @media(max-width:700px) {
            .options {
                grid-template-columns: 1fr;
            }

            .question-text {
                font-size: 30px;
            }

            .hud {
                font-size: 15px;
            }

            .two-fields {
                flex-direction: column;
            }

            .app-container,
            .view-screen {
                min-height: 100vh;
            }
        }
    </style>
</head>

<body>

<div class="app-container" id="app-container">

    <button class="bgm-btn" id="bgm-btn" onclick="toggleBGM()">
        🎵 BGM: 关
    </button>


    <!-- ================= LOGIN ================= -->

    <div id="screen-login" class="view-screen active">

        <div class="top-title">
            🏰 数学逃脱密室
        </div>

        <div class="subtitle">
            四年级数学 · 除法大挑战
        </div>

        <div class="panel">

            <div class="field">

                <label>👦 学生姓名：</label>

                <input
                    type="text"
                    id="input-name"
                    value="林小明">

            </div>


            <div class="field">

                <label>🏫 学校：</label>

                <input
                    type="text"
                    id="input-school"
                    value="华小">

            </div>


            <div class="two-fields">

                <div class="field">

                    <label>📚 班级：</label>

                    <input
                        type="text"
                        id="input-class"
                        value="4 仁班">

                </div>


                <div class="field">

                    <label>🎙 AI 老师：</label>

                    <select id="voice-gender">

                        <option value="female">

                        </option>

                    </select>

                </div>

            </div>

        </div>


        <div style="
            display:flex;
            gap:12px;
            margin-top:20px;">

            <button
                class="btn btn-green"
                onclick="startGame()">

                🚀 开始挑战

            </button>

        </div>

    </div>


    <!-- ================= GAME ================= -->

    <div id="screen-game" class="view-screen">

        <div class="hud">

            <span>
                👤 <span id="hud-name">小明</span>
            </span>

            <span>
                🪙 金币：
                <b id="hud-coins">0</b>
            </span>

            <span>
                🔑 钥匙：
                <b id="hud-keys">0/2</b>
            </span>

            <span>

                <b id="hud-crystals">0/2</b>
            </span>

        </div>


        <div class="level-bar">

            <span>
                关卡：
                <b id="level-indicator">1/5</b>
            </span>

            <span
                id="ai-level-badge"
                class="ai-badge ai-l1">

                🟢 Level 1：独立挑战

            </span>

        </div>


        <div class="speech">

            <div
                class="avatar"
                id="ai-avatar">

                👩‍🏫

            </div>

            <div
                class="speech-text"
                id="ai-speech">

                请独立完成这道除法题目，加油！

            </div>

        </div>


        <div
            class="workspace"
            id="visual-workspace">
        </div>


        <div class="question-card">

            <div
                class="question-text"
                id="q-text">

                84 ÷ 4 = ?

            </div>

        </div>


        <div
            class="options"
            id="options-grid">
        </div>

    </div>


    <!-- ================= CHEST ================= -->

    <div id="screen-chest" class="view-screen">

        <div class="top-title">
            🎉 恭喜完成第一阶段！
        </div>

        <div class="subtitle">
            你已经成功破解基础除法密室！
        </div>

        <div class="chest">
            💎 🔑 🪙
        </div>

        <div class="panel center">

            <h2>
                Level 1 完成！
            </h2>

            <p>
                接下来进入 Level 2 除法挑战。
            </p>

        </div>

        <button
            class="btn btn-green"
            style="margin-top:20px;"
            onclick="nextStage()">

            🚪 进入 Level 2

        </button>

    <!-- ================= REPORT ================= -->

    <div id="screen-report" class="view-screen">

        <div class="top-title">
            🏆 AI 除法学习诊断报告
        </div>

        <div
            class="report-box"
            id="report-content">
        </div>

        <div style="
            display:flex;
            gap:12px;
            margin-top:15px;">

            <button
                class="btn btn-blue"
                onclick="window.print()">

                📄 打印报告

            <button
                class="btn btn-green"
                onclick="location.reload()">

                🔄 重新挑战

            </button>

        </div>

    </div>

</div>


<script>

/* =====================================================
   GOOGLE SHEET
   四年级除法
===================================================== */

const GOOGLE_SHEET_WEBAPP_URL =
    "https://script.google.com/macros/s/AKfycby1Ad-sjChMFZdYFLwCoPSwyuuDMd2Yd_Qz4H112GkWMwOMix7j2RWrYcZD4kDspR8h/exec";


/* =====================================================
   声音
===================================================== */

let audioContext = null;

let bgmPlaying = false;

let bgmTimer = null;


function initAudio() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if (
        audioContext.state === "suspended"
    ) {

        audioContext.resume();

    }

}


function playCorrectSound() {

    initAudio();

    const osc =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    osc.type = "sine";

    osc.frequency.setValueAtTime(
        523.25,
        audioContext.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
        1046.5,
        audioContext.currentTime + .25
    );

    gain.gain.setValueAtTime(
        .25,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .01,
        audioContext.currentTime + .25
    );

    osc.connect(gain);

    gain.connect(
        audioContext.destination
    );

    osc.start();

    osc.stop(
        audioContext.currentTime + .25
    );

}


function playWrongSound() {

    initAudio();

    const osc =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    osc.type = "sawtooth";

    osc.frequency.setValueAtTime(
        180,
        audioContext.currentTime
    );

    osc.frequency.linearRampToValueAtTime(
        90,
        audioContext.currentTime + .3
    );

    gain.gain.setValueAtTime(
        .25,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .01,
        audioContext.currentTime + .3
    );

    osc.connect(gain);

    gain.connect(
        audioContext.destination
    );

    osc.start();

    osc.stop(
        audioContext.currentTime + .3
    );

}


function toggleBGM() {

    initAudio();

    const btn =
        document.getElementById(
            "bgm-btn"
        );

    if (bgmPlaying) {

        bgmPlaying = false;

        if (bgmTimer) {

            clearInterval(
                bgmTimer
            );

            bgmTimer = null;

        }

        btn.innerText =
            "🎵 BGM: 关";

        return;

    }

    bgmPlaying = true;

    btn.innerText =
        "🎵 BGM: 开";

    const notes = [
        261.63,
        329.63,
        392,
        329.63,
        293.66,
        349.23,
        440,
        349.23
    ];

    let index = 0;

    bgmTimer =
        setInterval(
            () => {

                if (!bgmPlaying) {
                    return;
                }

                const osc =
                    audioContext.createOscillator();

                const gain =
                    audioContext.createGain();

                osc.type = "square";

                osc.frequency.setValueAtTime(
                    notes[index],
                    audioContext.currentTime
                );

                gain.gain.setValueAtTime(
                    .018,
                    audioContext.currentTime
                );

                gain.gain.exponentialRampToValueAtTime(
                    .001,
                    audioContext.currentTime + .18
                );

                osc.connect(gain);

                gain.connect(
                    audioContext.destination
                );

                osc.start();

                osc.stop(
                    audioContext.currentTime + .18
                );

                index =
                    (index + 1) %
                    notes.length;

            },
            240
        );

}


function speakText(text) {

    if (
        "speechSynthesis"
        in window
    ) {

        window.speechSynthesis.cancel();

        const speech =
            new SpeechSynthesisUtterance(
                text
            );

        speech.lang =
            "zh-CN";

        speech.rate =
            .95;

        window.speechSynthesis.speak(
            speech
        );

    }

}


/* =====================================================
   学生资料
===================================================== */

let playerData = {

    name: "",

    school: "",

    classInfo: "",

    voice: "female",

    coins: 0,

    keys: 0,

    crystals: 0

};


/* =====================================================
   游戏状态
===================================================== */

let currentStage = 1;

let currentQuestionIndex = 0;

let stageQuestions = [];

let currentQuestion = null;

let wrongAttempts = 0;

let gameStartTime = null;

let gameEndTime = null;


/* =====================================================
   统计
===================================================== */

let stats = {

    totalAnswered: 0,

    correctFirstTry: 0,

    aiHelpCount: 0,

    stage1FirstCorrect: 0,

    stage2FirstCorrect: 0

};


/* =====================================================
   学生记录
===================================================== */

let studentLogs = [];


/* =====================================================
   题库
===================================================== */

const questionBank = {

    stage1: [

        {
            q: "84 ÷ 4 = ?",
            a: 21,
            opts: [21, 24, 18, 20]
        },

        {
            q: "96 ÷ 3 = ?",
            a: 32,
            opts: [32, 36, 29, 31]
        },

        {
            q: "144 ÷ 4 = ?",
            a: 36,
            opts: [36, 34, 46, 32]
        },

        {
            q: "225 ÷ 5 = ?",
            a: 45,
            opts: [45, 55, 35, 40]
        },

        {
            q: "360 ÷ 6 = ?",
            a: 60,
            opts: [60, 66, 56, 50]
        }

    ],

    stage2: [

        {
            q: "728 ÷ 7 = ?",
            a: 104,
            opts: [104, 114, 94, 108]
        },

        {
            q: "936 ÷ 8 = ?",
            a: 117,
            opts: [117, 127, 107, 112]
        },

        {
            q: "1248 ÷ 6 = ?",
            a: 208,
            opts: [208, 218, 198, 204]
        },

        {
            q: "1536 ÷ 8 = ?",
            a: 192,
            opts: [192, 182, 202, 196]
        },

        {
            q: "1728 ÷ 9 = ?",
            a: 192,
            opts: [192, 198, 182, 202]
        }

    ]

};


/* =====================================================
   页面切换
===================================================== */

function showScreen(id) {

    document
        .querySelectorAll(".view-screen")
        .forEach(
            screen =>
                screen.classList.remove(
                    "active"
                )
        );

    document
        .getElementById(id)
        .classList.add(
            "active"
        );

}


/* =====================================================
   开始游戏
===================================================== */

function startGame() {

    initAudio();

    playerData.name =
        document
            .getElementById(
                "input-name"
            )
            .value
            .trim() ||
        "小明";


    playerData.school =
        document
            .getElementById(
                "input-school"
            )
            .value
            .trim() ||
        "华小";


    playerData.classInfo =
        document
            .getElementById(
                "input-class"
            )
            .value
            .trim() ||
        "4A";


    playerData.voice =
        document
            .getElementById(
                "voice-gender"
            )
            .value;


    playerData.coins = 0;

    playerData.keys = 0;

    playerData.crystals = 0;


    stats = {

        totalAnswered: 0,

        correctFirstTry: 0,

        aiHelpCount: 0,

        stage1FirstCorrect: 0,

        stage2FirstCorrect: 0

    };


    studentLogs = [];

    gameStartTime =
        new Date();

    gameEndTime = null;


    document
        .getElementById(
            "hud-name"
        )
        .innerText =
        playerData.name;


    document
        .getElementById(
            "ai-avatar"
        )
        .innerText =
        playerData.voice === "female"
            ? "👩‍🏫"
            : "👨‍🏫";


    updateHUD();

    showScreen(
        "screen-game"
    );

    loadStage(1);

}


/* =====================================================
   HUD
===================================================== */

function updateHUD() {

    document
        .getElementById(
            "hud-coins"
        )
        .innerText =
        playerData.coins;


    document
        .getElementById(
            "hud-keys"
        )
        .innerText =
        `${playerData.keys}/2`;


    document
        .getElementById(
            "hud-crystals"
        )
        .innerText =
        `${playerData.crystals}/2`;

}


/* =====================================================
   Level
===================================================== */

function loadStage(stageNumber) {

    currentStage =
        stageNumber;

    currentQuestionIndex = 0;

    stageQuestions =
        questionBank[
            `stage${stageNumber}`
        ];

    loadQuestion();

}


/* =====================================================
   载入题目
===================================================== */

function loadQuestion() {

    wrongAttempts = 0;

    currentQuestion =
        stageQuestions[
            currentQuestionIndex
        ];


    document
        .getElementById(
            "level-indicator"
        )
        .innerText =
        `${currentQuestionIndex + 1}/${stageQuestions.length}`;


    document
        .getElementById(
            "q-text"
        )
        .innerText =
        `${currentQuestionIndex + 1}. ${currentQuestion.q}`;


    const badge =
        document
            .getElementById(
                "ai-level-badge"
            );

    badge.className =
        "ai-badge ai-l1";

    badge.innerText =
        "🟢 Level 1：独立挑战";


    const speech =
        document
            .getElementById(
                "ai-speech"
            );

    speech.innerText =
        "请独立完成这道除法题目，加油！";


    renderOptions(
        currentQuestion.opts
    );


    document
        .getElementById(
            "visual-workspace"
        )
        .classList.remove(
            "active"
        );

}


/* =====================================================
   选项
===================================================== */

function renderOptions(options) {

    const grid =
        document
            .getElementById(
                "options-grid"
            );

    grid.innerHTML = "";


    const shuffled =
        [...options]
            .sort(
                () =>
                    Math.random() - .5
            );


    shuffled.forEach(
        (option, index) => {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "option-btn";

            button.innerText =
                `${String.fromCharCode(65 + index)}. ${option}`;


            button.onclick =
                () =>
                    handleAnswer(
                        option
                    );


            grid.appendChild(
                button
            );

        }
    );

}


/* =====================================================
   答题
===================================================== */

function handleAnswer(selected) {

    const correct =
        selected ===
        currentQuestion.a;


    stats.totalAnswered++;


    if (correct) {

        playCorrectSound();


        const firstTry =
            wrongAttempts === 0;


        if (firstTry) {

            stats.correctFirstTry++;


            if (
                currentStage === 1
            ) {

                stats.stage1FirstCorrect++;

            } else {

                stats.stage2FirstCorrect++;

            }

        }


        studentLogs.push({

            questionIndex:
                (
                    currentStage === 1
                        ? currentQuestionIndex
                        : currentQuestionIndex + 5
                ),

            isFirstTryCorrect:
                firstTry,

            neededHelper:
                wrongAttempts > 0

        });


        playerData.coins += 10;


        if (
            currentStage === 1 &&
            currentQuestionIndex === 4
        ) {

            playerData.keys = 2;

            playerData.crystals = 1;

        }


        if (
            currentStage === 2 &&
            currentQuestionIndex === 4
        ) {

            playerData.crystals = 2;

        }


        updateHUD();


        currentQuestionIndex++;


        if (
            currentQuestionIndex <
            stageQuestions.length
        ) {

            loadQuestion();

        } else {

            finishStage();

        }


    } else {

        playWrongSound();


        wrongAttempts++;

        stats.aiHelpCount++;


        document
            .getElementById(
                "app-container"
            )
            .classList.add(
                "shake"
            );


        setTimeout(
            () => {

                document
                    .getElementById(
                        "app-container"
                    )
                    .classList.remove(
                        "shake"
                    );

            },
            400
        );


        showHelper();

    }

}


/* =====================================================
   AI 辅助
===================================================== */

function showHelper() {

    const badge =
        document
            .getElementById(
                "ai-level-badge"
            );

    const speech =
        document
            .getElementById(
                "ai-speech"
            );


    badge.className =
        "ai-badge ai-l2";

    badge.innerText =
        "🟡 Level 2：AI 除法助手";


    speech.innerText =
        "别急！我们一起看看除法的计算方法。";


    speakText(
        speech.innerText
    );


    const workspace =
        document
            .getElementById(
                "visual-workspace"
            );


    workspace.classList.add(
        "active"
    );


    workspace.innerHTML = `

        <div class="division-box">

            <div class="division-question">
                ${currentQuestion.q}
            </div>

            <div>
                💡 除法小提示：
            </div>

            <div>
                想一想：
                <b>
                    商 × 除数 = 被除数
                </b>
            </div>

            <div>
                例如：
                如果
                ${currentQuestion.a}
                ×
                ${getDivisor()}
                =
                ${getDividend()}
                ，
                那么答案就是
                ${currentQuestion.a}
            </div>

        </div>

    `;

}


/* =====================================================
   除数
===================================================== */

function getDivisor() {

    const parts =
        currentQuestion.q
            .split("÷");

    if (
        parts.length === 2
    ) {

        return parts[1]
            .replace(
                "=",
                ""
            )
            .replace(
                "?",
                ""
            )
            .trim();

    }

    return "";

}


/* =====================================================
   被除数
===================================================== */

function getDividend() {

    const parts =
        currentQuestion.q
            .split("÷");

    if (
        parts.length === 2
    ) {

        return parts[0].trim();

    }

    return "";

}


/* =====================================================
   Level 完成
===================================================== */

function finishStage() {

    if (
        currentStage === 1
    ) {

        showScreen(
            "screen-chest"
        );

        return;

    }


    showReport();

}


/* =====================================================
   进入 Level 2
===================================================== */

function nextStage() {

    showScreen(
        "screen-game"
    );

    loadStage(2);

}


/* =====================================================
   GOOGLE SHEET
===================================================== */

async function sendResultToGoogleSheet(
    durationSec
) {

    const level1Logs =
        studentLogs
            .slice(0, 5)
            .filter(Boolean);


    const level2Logs =
        studentLogs
            .slice(5, 10)
            .filter(Boolean);


    const digitalL1 =
        level1Logs.filter(
            log =>
                log.isFirstTryCorrect
        ).length;


    const digitalL2 =
        level2Logs.filter(
            log =>
                log.isFirstTryCorrect
        ).length;


    const aiHelp =
        studentLogs.filter(
            log =>
                log &&
                log.neededHelper
        ).length;


    const digitalTP3 =
        (
            digitalL1 >= 2
                ? 1
                : 0
        )
        +
        (
            digitalL2 >= 2
                ? 1
                : 0
        );


    const payload = {

        name:
            playerData.name,

        className:
            playerData.classInfo,

        kelas:
            playerData.classInfo,

        operation:
            "Bahagi",

        operasi:
            "Bahagi",

        digitalL1:
            digitalL1,

        digitalL1TP:
            digitalL1 >= 2
                ? "TP3"
                : "Belum TP3",

        digitalL2:
            digitalL2,

        digitalL2TP:
            digitalL2 >= 2
                ? "TP3"
                : "Belum TP3",

        digitalTP3:
            digitalTP3 + "/2",

        aiHelp:
            aiHelp,

        digitalTime:
            durationSec + " 秒",

        masa:
            durationSec + " 秒"

    };


    try {

        await fetch(
            GOOGLE_SHEET_WEBAPP_URL,
            {

                method: "POST",

                mode: "no-cors",

                headers: {

                    "Content-Type":
                        "text/plain;charset=UTF-8"

                },

                body:
                    JSON.stringify(
                        payload
                    )

            }
        );


        return true;


    } catch (error) {

        console.error(
            "Google Sheet error:",
            error
        );

        return false;

    }

}

    document

    // 自动发送成绩到 Google Sheet
    sendResultToGoogleSheet(

            success => {

                const status =

                if (success) {

                    status.innerText =

                    status.innerText =
                        "⚠️ Google Sheet 发送失败";

                    status.classList.add(

}
