<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🏰 数学逃脱密室 - 四年级乘法</title>

<style>
:root{
    --bg:#101d3b;
    --card:#182a52;
    --cyan:#00f0ff;
    --yellow:#ffea00;
    --green:#00ff66;
    --pink:#ff2a8d;
    --white:#fff;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:"Microsoft YaHei","Segoe UI",sans-serif;
    background:linear-gradient(135deg,#101d3b,#3159a5);
    color:var(--white);
    min-height:100vh;
    padding:15px;
}

#app{
    width:100%;
    max-width:1000px;
    min-height:720px;
    margin:auto;
    background:rgba(15,25,55,.97);
    border:4px solid var(--cyan);
    border-radius:28px;
    box-shadow:0 0 30px rgba(0,240,255,.45);
    overflow:hidden;
}

.screen{
    display:none;
    padding:28px;
}

.screen.active{
    display:block;
}

h1{
    text-align:center;
    color:var(--yellow);
    font-size:42px;
    margin:20px 0 30px;
    text-shadow:3px 3px #000;
}

h2{
    text-align:center;
    margin-bottom:20px;
}

.input-box{
    max-width:600px;
    margin:auto;
}

label{
    display:block;
    margin:15px 0 6px;
    font-size:20px;
    font-weight:bold;
}

input,select{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:3px solid var(--cyan);
    font-size:20px;
    background:#fff;
    color:#111;
}

button{
    cursor:pointer;
}

.main-btn{
    display:block;
    width:100%;
    margin-top:25px;
    padding:16px;
    border:3px solid white;
    border-radius:18px;
    background:linear-gradient(#00ff66,#009933);
    color:white;
    font-size:24px;
    font-weight:bold;
    box-shadow:0 6px #005522;
}

.main-btn:active{
    transform:translateY(4px);
    box-shadow:0 2px #005522;
}

.hud{
    display:flex;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    background:#ff0055;
    border:3px solid var(--yellow);
    border-radius:16px;
    padding:12px 18px;
    font-size:19px;
    font-weight:bold;
}

.level-bar{
    margin:15px 0;
    background:#087be8;
    border:3px solid white;
    border-radius:14px;
    padding:12px;
    display:flex;
    justify-content:space-between;
    font-size:20px;
    font-weight:bold;
}

.question{
    background:linear-gradient(#ff0055,#a50035);
    border:4px solid var(--yellow);
    border-radius:22px;
    padding:25px;
    text-align:center;
    margin-bottom:20px;
}

.question-text{
    font-size:42px;
    font-weight:900;
    text-shadow:3px 3px #000;
}

.options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.option{
    background:linear-gradient(#00eaff,#087be8);
    border:3px solid white;
    border-radius:18px;
    padding:18px;
    color:white;
    font-size:28px;
    font-weight:bold;
    text-shadow:2px 2px #000;
    box-shadow:0 6px #034a9c;
}

.option:active{
    transform:translateY(4px);
    box-shadow:0 2px #034a9c;
}

.ai{
    margin-top:20px;
    background:#101d35;
    border:3px solid var(--cyan);
    border-radius:18px;
    padding:18px;
    text-align:center;
}

.ai-title{
    font-size:23px;
    color:var(--yellow);
    font-weight:bold;
}

.ai-message{
    margin-top:10px;
    font-size:19px;
}

.vertical{
    display:none;
    margin-top:15px;
    padding:18px;
    background:#182d59;
    border:2px dashed var(--cyan);
    border-radius:15px;
}

.vertical.show{
    display:block;
}

.sum{
    font-size:32px;
    font-weight:bold;
    color:var(--yellow);
    margin:15px;
}

.report{
    max-width:750px;
    margin:auto;
    background:#101d35;
    border:3px solid var(--cyan);
    border-radius:20px;
    padding:20px;
}

.report-row{
    display:flex;
    justify-content:space-between;
    gap:20px;
    padding:14px 5px;
    border-bottom:2px dashed #087be8;
    font-size:20px;
}

.report-row strong{
    color:var(--yellow);
}

.success{
    margin-top:20px;
    padding:15px;
    border-radius:15px;
    background:#006633;
    text-align:center;
    font-size:20px;
    font-weight:bold;
}

.error{
    background:#8b2200;
}

.small{
    text-align:center;
    margin-top:20px;
    color:#ddd;
}

@media(max-width:650px){
    h1{font-size:30px}
    .question-text{font-size:32px}
    .options{grid-template-columns:1fr}
    .option{font-size:24px}
    .hud{font-size:16px}
    .report-row{font-size:16px}
}
</style>
</head>

<body>

<div id="app">

<!-- =========================
     首页
========================= -->

<section id="home" class="screen active">

<h1>🏰 数学逃脱密室</h1>

<h2>四年级数学 · 乘法特别版</h2>

<div class="input-box">

<label>👤 学生姓名</label>
<input id="name" placeholder="请输入学生姓名">

<label>🏫 学校</label>
<input id="school" placeholder="请输入学校名称">

<label>📚 班级</label>
<input id="className" placeholder="例如：4仁班">

<label>🔊 语音</label>
<select id="voice">
<option value="female">👩‍🏫 女老师</option>
<option value="male">👨‍🏫 男老师</option>
</select>

<button class="main-btn" onclick="startGame()">
🚀 开始数学挑战
</button>

</div>

<p class="small">
四年级数学 · 乘法 · AI分层学习
</p>

</section>


<!-- =========================
     游戏
========================= -->

<section id="game" class="screen">

<div class="hud">
<span>👤 <span id="hudName"></span></span>
<span>⭐ <span id="score">0</span></span>
<span>🤖 AI帮助：<span id="aiCount">0</span></span>
</div>

<div class="level-bar">
<span id="levelName">Level 1</span>
<span id="questionNo">1 / 5</span>
</div>

<div class="question">
<div id="question" class="question-text">
题目
</div>
</div>

<div id="options" class="options"></div>

<div class="ai">

<div id="aiTitle" class="ai-title">
🟢 Level 1：独立挑战
</div>

<div id="aiMessage" class="ai-message">
请先自己计算，再选择答案！
</div>

<div id="vertical" class="vertical">

<strong>🧮 AI竖式辅助</strong>

<div class="sum" id="verticalText"></div>

<p>
提示：先计算个位，再计算十位，最后相加。
</p>

</div>

</div>

</section>


<!-- =========================
     过关
========================= -->

<section id="stageComplete" class="screen">

<h1>🔑 Level 1 完成！</h1>

<h2>你已经获得钥匙！</h2>

<div class="report">

<div class="report-row">
<span>首次答对</span>
<strong id="stage1Result"></strong>
</div>

<div class="report-row">
<span>AI辅助</span>
<strong id="stage1AI"></strong>
</div>

</div>

<button class="main-btn" onclick="nextStage()">
🚪 进入 Level 2
</button>

</section>


<!-- =========================
     报告
========================= -->

<section id="report" class="screen">

<h1>🏆 AI 分层学习诊断报告</h1>

<div id="reportContent" class="report"></div>

<button class="main-btn" onclick="location.reload()">
🔄 再玩一次
</button>

</section>

</div>


<script>

/* =====================================================
   四年级 Apps Script Web App
===================================================== */

const GOOGLE_SHEET_WEBAPP_URL =
"https://script.google.com/macros/s/AKfycbwO8GSnUzsecafzOu6NlpWJHyG75hzSTeqc0PPY8mDn_nBjPeM8WawDy2D7xWoFsiRA/exec";


/* =====================================================
   乘法题库
===================================================== */

const questionBank = {

level1:[
    {
        q:"142 × 3 = ?",
        a:426,
        opts:[426,416,436,326]
    },
    {
        q:"214 × 4 = ?",
        a:856,
        opts:[856,846,816,866]
    },
    {
        q:"308 × 5 = ?",
        a:1540,
        opts:[1540,1500,1530,1640]
    },
    {
        q:"520 × 6 = ?",
        a:3120,
        opts:[3120,3100,3220,3020]
    },
    {
        q:"413 × 7 = ?",
        a:2891,
        opts:[2891,2881,2821,2991]
    }
],

level2:[
    {
        q:"34 × 21 = ?",
        a:714,
        opts:[714,724,614,704]
    },
    {
        q:"23 × 12 = ?",
        a:276,
        opts:[276,266,286,256]
    },
    {
        q:"45 × 16 = ?",
        a:720,
        opts:[720,710,730,680]
    },
    {
        q:"52 × 34 = ?",
        a:1768,
        opts:[1768,1758,1778,1668]
    },
    {
        q:"68 × 45 = ?",
        a:3060,
        opts:[3060,3050,2960,3160]
    }
]

};


/* =====================================================
   学生资料
===================================================== */

let student = {
    name:"",
    school:"",
    className:""
};


/* =====================================================
   游戏资料
===================================================== */

let currentLevel = 1;
let currentIndex = 0;

let currentQuestion = null;

let wrongAttempts = 0;

let startTime = null;
let endTime = null;

let score = 0;

let aiHelpCount = 0;

let level1FirstCorrect = 0;
let level2FirstCorrect = 0;

let totalAnswered = 0;


/* =====================================================
   切换页面
===================================================== */

function showScreen(id){

    document
        .querySelectorAll(".screen")
        .forEach(el=>{
            el.classList.remove("active");
        });

    document
        .getElementById(id)
        .classList.add("active");
}


/* =====================================================
   开始游戏
===================================================== */

function startGame(){

    student.name =
        document
        .getElementById("name")
        .value
        .trim();

    student.school =
        document
        .getElementById("school")
        .value
        .trim();

    student.className =
        document
        .getElementById("className")
        .value
        .trim();


    if(!student.name){

        alert("请输入学生姓名！");
        return;

    }


    if(!student.className){

        alert("请输入班级！");
        return;

    }


    document
        .getElementById("hudName")
        .innerText =
        student.name;


    currentLevel = 1;
    currentIndex = 0;

    wrongAttempts = 0;

    score = 0;

    aiHelpCount = 0;

    level1FirstCorrect = 0;
    level2FirstCorrect = 0;

    totalAnswered = 0;

    startTime = new Date();


    showScreen("game");

    loadQuestion();

}


/* =====================================================
   载入题目
===================================================== */

function loadQuestion(){

    const list =
        currentLevel === 1
        ? questionBank.level1
        : questionBank.level2;


    currentQuestion =
        list[currentIndex];


    wrongAttempts = 0;


    document
        .getElementById("levelName")
        .innerText =
        currentLevel === 1
        ? "🟢 Level 1：基础乘法"
        : "🟡 Level 2：进阶乘法";


    document
        .getElementById("questionNo")
        .innerText =
        (currentIndex + 1) +
        " / 5";


    document
        .getElementById("question")
        .innerText =
        currentQuestion.q;


    document
        .getElementById("vertical")
        .classList.remove("show");


    document
        .getElementById("aiTitle")
        .innerText =
        currentLevel === 1
        ? "🟢 Level 1：独立挑战"
        : "🟡 Level 2：进阶挑战";


    document
        .getElementById("aiMessage")
        .innerText =
        "请先自己计算，再选择答案！";


    renderOptions();

}


/* =====================================================
   答案选项
===================================================== */

function renderOptions(){

    const container =
        document
        .getElementById("options");


    container.innerHTML = "";


    const shuffled =
        [...currentQuestion.opts]
        .sort(
            ()=>Math.random()-0.5
        );


    shuffled.forEach(
        (option,index)=>{

            const btn =
                document
                .createElement("button");


            btn.className =
                "option";


            btn.innerText =
                String.fromCharCode(65+index)
                + ". "
                + option;


            btn.onclick =
                ()=>answer(
                    option
                );


            container.appendChild(btn);

        }
    );

}


/* =====================================================
   答题
===================================================== */

function answer(value){

    totalAnswered++;


    if(value === currentQuestion.a){

        score += 10;


        if(wrongAttempts === 0){

            if(currentLevel === 1){

                level1FirstCorrect++;

            }else{

                level2FirstCorrect++;

            }

        }


        document
            .getElementById("score")
            .innerText =
            score;


        currentIndex++;


        if(currentIndex >= 5){

            finishLevel();

        }else{

            loadQuestion();

        }


    }else{

        wrongAttempts++;

        aiHelpCount++;


        document
            .getElementById("aiCount")
            .innerText =
            aiHelpCount;


        showAIHelp();

    }

}


/* =====================================================
   AI 分层辅助
===================================================== */

function showAIHelp(){

    if(wrongAttempts === 1){

        document
            .getElementById("aiTitle")
            .innerText =
            "🤖 Level 2：AI提示";


        document
            .getElementById("aiMessage")
            .innerText =
            "再检查一次个位和进位，慢慢计算。";

    }


    if(wrongAttempts >= 2){

        document
            .getElementById("aiTitle")
            .innerText =
            "🤖 AI竖式辅助";


        document
            .getElementById("aiMessage")
            .innerText =
            "我来帮助你观察乘法的位值。";


        showVertical();

    }

}


/* =====================================================
   显示竖式
===================================================== */

function showVertical(){

    const box =
        document
        .getElementById("vertical");


    const question =
        currentQuestion.q;


    document
        .getElementById("verticalText")
        .innerText =
        question.replace(" = ?","");


    box.classList.add("show");

}


/* =====================================================
   完成 Level
===================================================== */

function finishLevel(){

    if(currentLevel === 1){

        document
            .getElementById("stage1Result")
            .innerText =
            level1FirstCorrect +
            " / 5";


        document
            .getElementById("stage1AI")
            .innerText =
            aiHelpCount +
            " 次";


        showScreen("stageComplete");

    }else{

        showReport();

    }

}


/* =====================================================
   Level 2
===================================================== */

function nextStage(){

    currentLevel = 2;

    currentIndex = 0;

    showScreen("game");

    loadQuestion();

}


/* =====================================================
   TP3
===================================================== */

function getTP3(score){

    return Number(score) >= 2
        ? "TP3"
        : "Belum TP3";

}


/* =====================================================
   发送 Google Sheet
===================================================== */

async function sendDataToGoogleSheet(
    duration
){

    const digitalTP3 =
        (
            level1FirstCorrect >= 2
            ? 1
            : 0
        )
        +
        (
            level2FirstCorrect >= 2
            ? 1
            : 0
        )
        +
        "/2";


    const payload = {

        name:
            student.name,

        nama:
            student.name,

        className:
            student.className,

        kelas:
            student.className,

        school:
            student.school,

        operation:
            "Darab",

        operasi:
            "Darab",


        /* Pre-Test */

        preL1:"",
        preL1TP:"",

        preL2:"",
        preL2TP:"",

        preTP3:"",


        /* Digital Level 1 */

        digitalL1:
            level1FirstCorrect,

        digitalL1TP:
            getTP3(
                level1FirstCorrect
            ),


        /* Digital Level 2 */

        digitalL2:
            level2FirstCorrect,

        digitalL2TP:
            getTP3(
                level2FirstCorrect
            ),


        /* Digital TP3 */

        digitalTP3:
            digitalTP3,


        /* AI */

        aiHelp:
            aiHelpCount,


        /* 时间 */

        digitalTime:
            duration + " 秒",

        masa:
            duration + " 秒",


        /* Post-Test */

        postL1:"",
        postL1TP:"",

        postL2:"",
        postL2TP:"",

        postTP3:""

    };


    try{

        await fetch(

            GOOGLE_SHEET_WEBAPP_URL,

            {

                method:"POST",

                mode:"no-cors",

                headers:{
                    "Content-Type":
                    "text/plain;charset=utf-8"
                },

                body:
                    JSON.stringify(
                        payload
                    )

            }

        );


        return true;

    }catch(error){

        console.error(
            error
        );

        return false;

    }

}


/* =====================================================
   最终报告
===================================================== */

async function showReport(){

    endTime = new Date();


    const duration =
        Math.round(
            (
                endTime -
                startTime
            ) / 1000
        );


    const l1TP =
        getTP3(
            level1FirstCorrect
        );


    const l2TP =
        getTP3(
            level2FirstCorrect
        );


    const digitalTP3Count =
        (
            level1FirstCorrect >= 2
            ? 1
            : 0
        )
        +
        (
            level2FirstCorrect >= 2
            ? 1
            : 0
        );


    const report =
        document
        .getElementById(
            "reportContent"
        );


    report.innerHTML = `

        <div class="report-row">
            <span>👤 学生姓名</span>
            <strong>
                ${student.name}
            </strong>
        </div>

        <div class="report-row">
            <span>🏫 班级</span>
            <strong>
                ${student.className}
            </strong>
        </div>

        <div class="report-row">
            <span>⏱ 答题时间</span>
            <strong>
                ${duration} 秒
            </strong>
        </div>

        <div class="report-row">
            <span>🟢 Level 1 首次答对</span>
            <strong>
                ${level1FirstCorrect}/5
                → ${l1TP}
            </strong>
        </div>

        <div class="report-row">
            <span>🟡 Level 2 首次答对</span>
            <strong>
                ${level2FirstCorrect}/5
                → ${l2TP}
            </strong>
        </div>

        <div class="report-row">
            <span>🏆 Digital TP3</span>
            <strong>
                ${digitalTP3Count}/2
            </strong>
        </div>

        <div class="report-row">
            <span>🤖 AI辅助次数</span>
            <strong>
                ${aiHelpCount} 次
            </strong>
        </div>

        <div id="sheetStatus"
             class="success">
            📤 正在发送成绩到 Google Sheet...
        </div>

    `;


    showScreen("report");


    const sent =
        await sendDataToGoogleSheet(
            duration
        );


    const status =
        document
        .getElementById(
            "sheetStatus"
        );


    if(sent){

        status.innerText =
            "✅ 成绩已发送到 Google Sheet";

    }else{

        status.innerText =
            "⚠️ 发送失败，请检查网络";

        status.classList.add(
            "error"
        );

    }

}

</script>

</body>
</html>
