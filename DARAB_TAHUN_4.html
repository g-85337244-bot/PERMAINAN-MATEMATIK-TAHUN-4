<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>🎮 四年级数学乘法 · DME</title>

<style>

:root{
    --bg:#0b1838;
    --card:#10254d;
    --blue:#008cff;
    --cyan:#00eaff;
    --green:#00ff66;
    --yellow:#ffd900;
    --red:#ff5555;
    --white:#ffffff;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:
        "Noto Sans SC",
        "Microsoft YaHei",
        Arial,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #07152f,
            #102a57,
            #07152f
        );

    color:var(--white);
}

.container{
    width:95%;
    max-width:1000px;
    margin:30px auto;
}

.card{
    background:
        linear-gradient(
            145deg,
            rgba(20,48,95,.98),
            rgba(7,25,60,.98)
        );

    border:2px solid var(--cyan);

    border-radius:24px;

    padding:30px;

    box-shadow:
        0 0 25px rgba(0,234,255,.18);
}

h1{
    text-align:center;
    color:var(--yellow);
    margin-top:0;
}

h2{
    text-align:center;
}

.subtitle{
    text-align:center;
    color:#cde7ff;
    margin-bottom:25px;
}

.input-group{
    margin:15px 0;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
    font-size:18px;
}

input,
select{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:2px solid #2279c9;
    background:#071a3c;
    color:white;
    font-size:17px;
}

button{
    border:none;
    cursor:pointer;
    font-weight:bold;
}

.main-btn{
    width:100%;
    padding:16px;
    margin-top:20px;

    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            #007a3d,
            #00b85a
        );

    color:white;

    font-size:20px;

    box-shadow:
        0 5px 15px rgba(0,0,0,.25);
}

.main-btn:hover{
    transform:scale(1.01);
}

.screen{
    display:none;
}

.screen.active{
    display:block;
}

.hud{
    display:grid;
    grid-template-columns:
        repeat(3,1fr);

    gap:10px;

    margin-bottom:20px;
}

.hud-box{
    background:#071a3c;
    border:1px solid #1769b1;
    border-radius:12px;
    padding:12px;
    text-align:center;
}

.hud-value{
    color:var(--yellow);
    font-size:20px;
    font-weight:bold;
}

.level-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;

    background:#071a3c;

    padding:14px 18px;

    border-radius:12px;

    border:1px solid #1769b1;

    margin-bottom:20px;
}

.level-name{
    color:#55ff9a;
    font-size:20px;
    font-weight:bold;
}

.question-card{
    background:#081b40;
    border:2px solid #1769b1;
    border-radius:20px;
    padding:25px;
    text-align:center;
}

.question{
    font-size:34px;
    font-weight:bold;
    margin:20px 0 30px;
    color:white;
}

.options{
    display:grid;
    grid-template-columns:
        repeat(2,1fr);

    gap:15px;
}

.option{
    padding:18px;

    border-radius:14px;

    background:#12376d;

    border:2px solid #267bc5;

    color:white;

    font-size:22px;

    transition:.15s;
}

.option:hover{
    background:#1a4d8f;
    transform:scale(1.02);
}

.ai-box{
    margin-top:20px;

    background:
        linear-gradient(
            135deg,
            #162f61,
            #0b2048
        );

    border:2px solid #7b9cff;

    border-radius:16px;

    padding:20px;

    display:none;
}

.ai-title{
    color:var(--yellow);
    font-size:20px;
    font-weight:bold;
    margin-bottom:10px;
}

.ai-message{
    line-height:1.7;
}

.vertical{
    margin-top:15px;

    background:#071832;

    border-radius:12px;

    padding:15px;

    font-family:monospace;

    font-size:20px;

    white-space:pre-line;

    color:#9ee7ff;
}

.stage-card{
    text-align:center;

    background:#081b40;

    border-radius:18px;

    padding:30px;

    border:2px solid #2478c7;
}

.stage-score{
    font-size:32px;
    color:var(--yellow);
    margin:20px 0;
}

.report{
    margin-top:20px;
}

.report-item{
    display:flex;
    justify-content:space-between;

    padding:15px 5px;

    border-bottom:
        1px dashed #2478c7;

    gap:15px;
}

.report-item strong{
    color:var(--yellow);
    text-align:right;
}

.success{
    margin-top:20px;

    padding:18px;

    border-radius:15px;

    background:#006633;

    text-align:center;

    color:white;

    font-size:18px;
}

.fail{
    margin-top:20px;

    padding:18px;

    border-radius:15px;

    background:#773300;

    text-align:center;

    color:white;

    font-size:18px;
}

.small{
    text-align:center;
    color:#9fc9ee;
    margin-top:20px;
}

@media(max-width:700px){

    .container{
        width:96%;
        margin:15px auto;
    }

    .card{
        padding:18px;
    }

    .hud{
        grid-template-columns:1fr;
    }

    .options{
        grid-template-columns:1fr;
    }

    .question{
        font-size:27px;
    }

}

</style>

</head>


<body>


<div class="container">

<div class="card">


<!-- =====================================================
     首页
===================================================== -->

<section id="startScreen" class="screen active">

<h1>
🎮 数学逃脱密室
</h1>

<h2>
四年级数学 · 乘法
</h2>

<p class="subtitle">
DME Digital Math Empowerment
<br>
AI 智能分层学习
</p>


<div class="input-group">

<label>
👤 学生姓名
</label>

<input
id="studentName"
type="text"
placeholder="请输入学生姓名">

</div>


<div class="input-group">

<label>
🏫 学校
</label>

<input
id="schoolName"
type="text"
placeholder="请输入学校名称"
value="SJKC">

</div>


<div class="input-group">

<label>
📚 班级
</label>

<input
id="className"
type="text"
placeholder="例如：4仁班">

</div>


<button
class="main-btn"
onclick="startGame()">

🚀 开始数学挑战

</button>


<p class="small">

四年级数学 · 乘法 · AI 分层学习

</p>

</section>



<!-- =====================================================
     游戏
===================================================== -->

<section id="gameScreen" class="screen">


<div class="hud">

<div class="hud-box">

<div>👤 学生</div>

<div
class="hud-value"
id="hudName">
-
</div>

</div>


<div class="hud-box">

<div>⭐ 得分</div>

<div
class="hud-value"
id="score">
0
</div>

</div>


<div class="hud-box">

<div>🤖 AI帮助</div>

<div
class="hud-value"
id="aiCount">
0
</div>

</div>

</div>


<div class="level-bar">

<div
class="level-name"
id="levelName">

🟢 Level 1

</div>

<div id="questionNumber">

1 / 5

</div>

</div>


<div class="question-card">


<div
id="question"
class="question">

题目

</div>


<div
id="options"
class="options">
</div>


<div
id="aiBox"
class="ai-box">

<div
class="ai-title"
id="aiTitle">

🤖 AI 学习助手

</div>


<div
class="ai-message"
id="aiMessage">

请先独立思考。

</div>


<div
id="vertical"
class="vertical">
</div>

</div>


</div>


</section>



<!-- =====================================================
     Level 完成
===================================================== -->

<section
id="stageScreen"
class="screen">


<div class="stage-card">

<h1>
🔑 Level 完成！
</h1>


<p>
恭喜你完成这一关！
</p>


<div
class="stage-score"
id="stageScore">

5 / 5

</div>


<div id="stageAI">

🤖 AI辅助：0 次

</div>


<button
class="main-btn"
onclick="nextStage()">

🚪 进入下一关

</button>

</div>

</section>



<!-- =====================================================
     最终报告
===================================================== -->

<section
id="reportScreen"
class="screen">


<h1>
🏆 学习完成！
</h1>


<div
id="report"
class="report">
</div>


<div
id="sheetStatus"
class="success">

📤 正在发送成绩到 Google Sheet...

</div>


<button
class="main-btn"
onclick="location.reload()">

🔄 再玩一次

</button>


</section>


</div>

</div>



<script>


// =====================================================
// GOOGLE APPS SCRIPT WEB APP
// 四年级乘法
// =====================================================

const GOOGLE_SHEET_WEBAPP_URL =
"https://script.google.com/macros/s/AKfycbxox6Bm3lLwgtEP3rbqxiTzuMUcmApAOE0kdHnfptELVxuro4ULc4IN94ulMzAsMqcB/exec";


// =====================================================
// 学生资料
// =====================================================

let playerData = {

    name:"",
    school:"",
    className:""

};


// =====================================================
// 游戏资料
// =====================================================

let currentStage = 1;

let currentQuestionIndex = 0;

let currentQuestion = null;

let stageQuestions = [];

let wrongAttempts = 0;

let stage1FirstCorrect = 0;

let stage2FirstCorrect = 0;

let totalFirstCorrect = 0;

let totalAnswered = 0;

let aiHelpCount = 0;

let score = 0;

let startTime = null;

let endTime = null;

let sending = false;


// =====================================================
// 四年级乘法题库
//
// Level 1：基础乘法
// Level 2：较高难度乘法
//
// 每关 5 题
// =====================================================

const questionBank = {


stage1: [

    {
        q:"24 × 3 = ?",
        a:72,
        opts:[72,62,82,76]
    },

    {
        q:"36 × 4 = ?",
        a:144,
        opts:[134,144,154,164]
    },

    {
        q:"125 × 4 = ?",
        a:500,
        opts:[400,450,500,550]
    },

    {
        q:"213 × 3 = ?",
        a:639,
        opts:[629,639,649,659]
    },

    {
        q:"324 × 2 = ?",
        a:648,
        opts:[638,648,658,668]
    }

],


stage2: [

    {
        q:"42 × 12 = ?",
        a:504,
        opts:[494,504,514,524]
    },

    {
        q:"125 × 16 = ?",
        a:2000,
        opts:[1800,1900,2000,2100]
    },

    {
        q:"234 × 15 = ?",
        a:3510,
        opts:[3410,3510,3610,3710]
    },

    {
        q:"325 × 24 = ?",
        a:7800,
        opts:[7600,7700,7800,7900]
    },

    {
        q:"412 × 25 = ?",
        a:10300,
        opts:[9300,10000,10300,11300]
    }

]

};


// =====================================================
// 开始游戏
// =====================================================

function startGame(){

    playerData.name =
        document
        .getElementById("studentName")
        .value
        .trim();

    playerData.school =
        document
        .getElementById("schoolName")
        .value
        .trim();

    playerData.className =
        document
        .getElementById("className")
        .value
        .trim();


    if(!playerData.name){

        alert("请输入学生姓名。");

        return;

    }


    if(!playerData.className){

        alert("请输入班级。");

        return;

    }


    currentStage = 1;

    currentQuestionIndex = 0;

    stage1FirstCorrect = 0;

    stage2FirstCorrect = 0;

    totalFirstCorrect = 0;

    totalAnswered = 0;

    aiHelpCount = 0;

    score = 0;

    sending = false;

    startTime = new Date();


    document
    .getElementById("hudName")
    .innerText =
        playerData.name;


    document
    .getElementById("score")
    .innerText =
        "0";


    document
    .getElementById("aiCount")
    .innerText =
        "0";


    showScreen("gameScreen");


    loadStage(1);

}


// =====================================================
// 显示页面
// =====================================================

function showScreen(id){

    document
    .querySelectorAll(".screen")
    .forEach(function(screen){

        screen.classList.remove("active");

    });


    document
    .getElementById(id)
    .classList.add("active");

}


// =====================================================
// 加载 Level
// =====================================================

function loadStage(stage){

    currentStage = stage;

    currentQuestionIndex = 0;

    wrongAttempts = 0;

    stageQuestions =
        questionBank[
            "stage" + stage
        ];

    document
    .getElementById("levelName")
    .innerText =
        stage === 1
        ? "🟢 Level 1：基础挑战"
        : "🟡 Level 2：进阶挑战";


    loadQuestion();

}


// =====================================================
// 加载题目
// =====================================================

function loadQuestion(){

    wrongAttempts = 0;

    currentQuestion =
        stageQuestions[
            currentQuestionIndex
        ];


    document
    .getElementById("questionNumber")
    .innerText =
        (
            currentQuestionIndex + 1
        ) +
        " / " +
        stageQuestions.length;


    document
    .getElementById("question")
    .innerText =
        currentQuestion.q;


    document
    .getElementById("aiBox")
    .style.display =
        "none";


    renderOptions();

}


// =====================================================
// 选择答案
// =====================================================

function renderOptions(){

    const box =
        document.getElementById(
            "options"
        );


    box.innerHTML = "";


    const shuffled =
        [...currentQuestion.opts]
        .sort(
            () =>
                Math.random() -
                0.5
        );


    shuffled.forEach(function(answer){

        const button =
            document.createElement(
                "button"
            );


        button.className =
            "option";


        button.innerText =
            answer;


        button.onclick =
            function(){

                checkAnswer(
                    answer
                );

            };


        box.appendChild(
            button
        );

    });

}


// =====================================================
// 检查答案
// =====================================================

function checkAnswer(answer){

    totalAnswered++;


    if(
        answer ===
        currentQuestion.a
    ){

        // =============================================
        // 首次答对
        // =============================================

        if(
            wrongAttempts === 0
        ){

            totalFirstCorrect++;


            if(
                currentStage === 1
            ){

                stage1FirstCorrect++;

            }
            else{

                stage2FirstCorrect++;

            }

        }


        score += 10;


        document
        .getElementById("score")
        .innerText =
            score;


        currentQuestionIndex++;


        if(
            currentQuestionIndex <
            stageQuestions.length
        ){

            loadQuestion();

        }
        else{

            finishStage();

        }


    }
    else{

        // =============================================
        // 答错 → AI辅助
        // =============================================

        wrongAttempts++;

        aiHelpCount++;


        document
        .getElementById("aiCount")
        .innerText =
            aiHelpCount;


        showAI();


    }

}


// =====================================================
// AI 辅助
// =====================================================

function showAI(){

    const box =
        document.getElementById(
            "aiBox"
        );


    box.style.display =
        "block";


    const message =
        document.getElementById(
            "aiMessage"
        );


    const vertical =
        document.getElementById(
            "vertical"
        );


    if(
        wrongAttempts === 1
    ){

        message.innerText =
            "💡 再想一想：可以把乘法看成相同数量的重复加法。";

        vertical.innerText =
            "例如：24 × 3\n\n" +
            "24 + 24 + 24\n" +
            "= 72";

    }
    else{

        message.innerText =
            "🤖 AI提示：我们一步一步计算。先算个位，再算十位，最后把结果相加。";


        const n1 =
            getNumber1(
                currentQuestion
            );


        const n2 =
            getNumber2(
                currentQuestion
            );


        vertical.innerText =
            n1 +
            " × " +
            n2 +
            "\n\n" +
            "请重新计算，再选择答案。";

    }

}


// =====================================================
// 从题目文字取得数字
// =====================================================

function getNumber1(question){

    const numbers =
        question.q
        .replace(/,/g,"")
        .match(/\d+/g);


    return numbers
        ? Number(numbers[0])
        : 0;

}


function getNumber2(question){

    const numbers =
        question.q
        .replace(/,/g,"")
        .match(/\d+/g);


    return numbers
        ? Number(numbers[1])
        : 0;

}


// =====================================================
// Level 完成
// =====================================================

function finishStage(){

    const result =
        currentStage === 1
        ? stage1FirstCorrect
        : stage2FirstCorrect;


    document
    .getElementById("stageScore")
    .innerText =
        result +
        " / 5";


    document
    .getElementById("stageAI")
    .innerText =
        "🤖 AI辅助：" +
        aiHelpCount +
        " 次";


    if(
        currentStage === 1
    ){

        document
        .querySelector(
            "#stageScreen .main-btn"
        )
        .innerText =
            "🚪 进入 Level 2";

    }
    else{

        document
        .querySelector(
            "#stageScreen .main-btn"
        )
        .innerText =
            "🏆 查看学习报告";

    }


    showScreen(
        "stageScreen"
    );

}


// =====================================================
// 下一关
// =====================================================

function nextStage(){

    if(
        currentStage === 1
    ){

        loadStage(2);

        showScreen(
            "gameScreen"
        );

    }
    else{

        showReport();

    }

}


// =====================================================
// 最终报告
// =====================================================

function showReport(){

    endTime =
        new Date();


    const duration =
        Math.max(
            1,
            Math.round(
                (
                    endTime -
                    startTime
                ) / 1000
            )
        );


    const l1 =
        stage1FirstCorrect;


    const l2 =
        stage2FirstCorrect;


    const l1TP =
        l1 >= 2
        ? "TP3"
        : "未达TP3";


    const l2TP =
        l2 >= 2
        ? "TP3"
        : "未达TP3";


    const digitalTP3 =
        (
            l1 >= 2
            ? 1
            : 0
        )
        +
        (
            l2 >= 2
            ? 1
            : 0
        );


    const accuracy =
        Math.round(
            (
                totalFirstCorrect /
                10
            ) * 100
        );


    document
    .getElementById("report")
    .innerHTML = `

        <div class="report-item">

            <span>👤 学生姓名：</span>

            <strong>
                ${playerData.name}
            </strong>

        </div>


        <div class="report-item">

            <span>🏫 学校：</span>

            <strong>
                ${playerData.school}
            </strong>

        </div>


        <div class="report-item">

            <span>📚 班级：</span>

            <strong>
                ${playerData.className}
            </strong>

        </div>


        <div class="report-item">

            <span>⏱ 答题时间：</span>

            <strong>
                ${duration} 秒
            </strong>

        </div>


        <div class="report-item">

            <span>🟢 Level 1 首次答对：</span>

            <strong>
                ${l1}/5 → ${l1TP}
            </strong>

        </div>


        <div class="report-item">

            <span>🟡 Level 2 首次答对：</span>

            <strong>
                ${l2}/5 → ${l2TP}
            </strong>

        </div>


        <div class="report-item">

            <span>🏆 Digital TP3：</span>

            <strong>
                ${digitalTP3}/2
            </strong>

        </div>


        <div class="report-item">

            <span>🎯 总首次答对：</span>

            <strong>
                ${totalFirstCorrect}/10
                (${accuracy}%)
            </strong>

        </div>


        <div class="report-item">

            <span>🤖 AI辅助次数：</span>

            <strong>
                ${aiHelpCount}
            </strong>

        </div>

    `;


    showScreen(
        "reportScreen"
    );


    sendToGoogleSheet(
        duration
    );

}


// =====================================================
// 发送 Google Sheet
// =====================================================

async function sendToGoogleSheet(
    duration
){

    if(sending){

        return;

    }


    sending = true;


    const status =
        document
        .getElementById(
            "sheetStatus"
        );


    status.className =
        "success";


    status.innerText =
        "📤 正在发送成绩到 Google Sheet...";


    const payload = {

        name:
            playerData.name,

        school:
            playerData.school,

        className:
            playerData.className,

        kelas:
            playerData.className,

        operation:
            "Darab",

        operasi:
            "Darab",


        // Pre-Test
        preL1:"",
        preL1TP:"",

        preL2:"",
        preL2TP:"",

        preTP3:"",


        // Digital Level 1
        digitalL1:
            stage1FirstCorrect,

        digitalL1TP:
            stage1FirstCorrect >= 2
            ? "TP3"
            : "Belum TP3",


        // Digital Level 2
        digitalL2:
            stage2FirstCorrect,

        digitalL2TP:
            stage2FirstCorrect >= 2
            ? "TP3"
            : "Belum TP3",


        // Digital TP3
        digitalTP3:
            (
                (
                    stage1FirstCorrect >= 2
                    ? 1
                    : 0
                )
                +
                (
                    stage2FirstCorrect >= 2
                    ? 1
                    : 0
                )
            )
            + "/2",


        // AI
        aiHelp:
            aiHelpCount,


        // 时间
        digitalTime:
            duration +
            " 秒",


        // Post-Test
        postL1:"",
        postL1TP:"",

        postL2:"",
        postL2TP:"",

        postTP3:""

    };


    try{

        await fetch(
            GOOGLE_SHEET_WEBAPP_URL,
            {

                method:"POST",

                mode:"no-cors",

                headers:{
                    "Content-Type":
                        "text/plain;charset=UTF-8"
                },

                body:
                    JSON.stringify(
                        payload
                    )

            }
        );


        status.className =
            "success";


        status.innerText =
            "✅ 成绩已发送到 Google Sheet";


    }
    catch(error){

        console.error(
            error
        );


        status.className =
            "fail";


        status.innerText =
            "⚠️ 发送失败，请检查网络连接。";


    }

    finally{

        sending = false;

    }

}


</script>

</body>

</html>
