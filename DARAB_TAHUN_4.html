/* =====================================================
   声音系统
===================================================== */

class SoundEngine{

constructor(){

this.ctx=null;
this.bgmTimer=null;
this.bgmPlaying=false;

}

initContext(){

if(!this.ctx){

this.ctx=
new(
window.AudioContext||
window.webkitAudioContext
)();

}

if(this.ctx.state==="suspended"){

this.ctx.resume();

}

}

playDing(){

this.initContext();

const osc=
this.ctx.createOscillator();

const gain=
this.ctx.createGain();

osc.type="sine";

osc.frequency.setValueAtTime(
523.25,
this.ctx.currentTime
);

osc.frequency.exponentialRampToValueAtTime(
1046.50,
this.ctx.currentTime+.3
);

gain.gain.setValueAtTime(
.3,
this.ctx.currentTime
);

gain.gain.exponentialRampToValueAtTime(
.01,
this.ctx.currentTime+.3
);

osc.connect(gain);
gain.connect(this.ctx.destination);

osc.start();
osc.stop(
this.ctx.currentTime+.3
);

}

playBuzz(){

this.initContext();

const osc=
this.ctx.createOscillator();

const gain=
this.ctx.createGain();

osc.type="sawtooth";

osc.frequency.setValueAtTime(
160,
this.ctx.currentTime
);

osc.frequency.linearRampToValueAtTime(
90,
this.ctx.currentTime+.35
);

gain.gain.setValueAtTime(
.3,
this.ctx.currentTime
);

gain.gain.exponentialRampToValueAtTime(
.01,
this.ctx.currentTime+.35
);

osc.connect(gain);
gain.connect(this.ctx.destination);

osc.start();
osc.stop(
this.ctx.currentTime+.35
);

}

playTick(){

this.initContext();

const osc=
this.ctx.createOscillator();

const gain=
this.ctx.createGain();

osc.type="sine";

osc.frequency.setValueAtTime(
800,
this.ctx.currentTime
);

gain.gain.setValueAtTime(
.1,
this.ctx.currentTime
);

gain.gain.exponentialRampToValueAtTime(
.001,
this.ctx.currentTime+.05
);

osc.connect(gain);
gain.connect(this.ctx.destination);

osc.start();
osc.stop(
this.ctx.currentTime+.05
);

}

toggleBGM(){

this.initContext();

const btn=
document.getElementById(
"bgm-btn"
);

if(this.bgmPlaying){

this.stopBGM();

btn.innerText="🔇 BGM: 关";

btn.style.borderColor=
"var(--accent-yellow)";

}else{

this.startBGM();

btn.innerText="🎵 BGM: 开";

btn.style.borderColor=
"var(--accent-green)";

}

}

startBGM(){

if(this.bgmPlaying)return;

this.bgmPlaying=true;

const notes=[
261.63,
329.63,
392.00,
329.63,
293.66,
349.23,
440.00,
349.23,
329.63,
392.00,
523.25,
392.00,
293.66,
349.23,
392.00,
293.66
];

let step=0;

this.bgmTimer=
setInterval(()=>{

if(!this.bgmPlaying)return;

const osc=
this.ctx.createOscillator();

const gain=
this.ctx.createGain();

osc.type="square";

osc.frequency.setValueAtTime(
notes[step],
this.ctx.currentTime
);

gain.gain.setValueAtTime(
.02,
this.ctx.currentTime
);

gain.gain.exponentialRampToValueAtTime(
.001,
this.ctx.currentTime+.2
);

osc.connect(gain);
gain.connect(this.ctx.destination);

osc.start();

osc.stop(
this.ctx.currentTime+.2
);

step=
(step+1)%notes.length;

},250);

}

stopBGM(){

this.bgmPlaying=false;

if(this.bgmTimer){

clearInterval(
this.bgmTimer
);

this.bgmTimer=null;

}

}

}


const soundAudio=

function speakText(text){

if(
"speechSynthesis"
in window

window.speechSynthesis.cancel();

const msg=
new SpeechSynthesisUtterance(
text
);

msg.lang="zh-CN";
msg.rate=.95;

window.speechSynthesis.speak(
msg
);

}

}

voiceEnabled:true
};

let currentStage=1;
let currentQIndex=0;
let stageQuestions=[];
let currentQuestion=null;

let currentAiLevel=1;
let wrongAttemptsForCurrentQ=0;

let stats={
totalAnswered:0,
correctFirstTry:0,
aiHelpsCount:0,
levelReachMax:1,
startTime:null,
endTime:null,
stage1FirstCorrect:0,
stage2FirstCorrect:0
};


/* =====================================================
   页面切换
===================================================== */

function showScreen(screenId){

document
.querySelectorAll(".view-screen")
.forEach(
s=>s.classList.remove("active")
);

document
.getElementById(screenId)
.classList.add("active");

}


/* =====================================================
   教师设置
===================================================== */

function openTeacherDashboard(){

soundAudio.playTick();

document
.getElementById("modal-teacher")
.classList.add("active");

}


function closeTeacherDashboard(){

soundAudio.playTick();

const radios=
document.getElementsByName(
"vs-mode"
);

radios.forEach(
r=>{
if(r.checked)
teacherConfig.visualMode=
r.value;
}
);

teacherConfig.voiceEnabled=
document.getElementById(
"cfg-voice"
).checked;

document
.getElementById("modal-teacher")
.classList.remove("active");

}


/* =====================================================
   HUD
===================================================== */

function updateHUD(){

document.getElementById(
"hud-coins"
).innerText=
playerData.coins;

document.getElementById(
"hud-keys"
).innerText=
`${playerData.keys}/2`;

document.getElementById(
"hud-crystals"
).innerText=
`${playerData.crystals}/2`;

}


/* =====================================================
   开始游戏
===================================================== */

function startGame(){

soundAudio.playTick();

playerData.name=
document.getElementById(
"input-name"
).value.trim()||
"小明";

playerData.school=
document.getElementById(
"input-school"
).value.trim()||
"华小";

playerData.className=
document.getElementById(
"input-class"
).value.trim()||
"4A";

playerData.voice=
document.getElementById(
"voice-gender"
).value;

playerData.coins=0;
playerData.keys=0;
playerData.crystals=0;

stats={
totalAnswered:0,
correctFirstTry:0,
aiHelpsCount:0,
levelReachMax:1,
startTime:new Date(),
endTime:null,
stage1FirstCorrect:0,
stage2FirstCorrect:0
};

document.getElementById(
"hud-name"
).innerText=
playerData.name;

document.getElementById(
"ai-avatar"
).innerText=
playerData.voice==="female"
?"👩‍🏫"
:"👨‍🏫";

updateHUD();

showScreen(
"screen-game"
);

loadStage(1);

}


/* =====================================================
   Level
===================================================== */

function loadStage(stageNum){

currentStage=stageNum;

currentQIndex=0;

stageQuestions=
questionBank[
`stage${stageNum}`
];

loadQuestion();

}


/* =====================================================
   题目
===================================================== */

function loadQuestion(){

wrongAttemptsForCurrentQ=0;

currentAiLevel=
teacherConfig.visualMode==="always"
?2
:1;

currentQuestion=
stageQuestions[
currentQIndex
];

document.getElementById(
"level-indicator"
).innerText=
`${currentQIndex+1}/${stageQuestions.length}`;

document.getElementById(
"q-text"
).innerText=
`${currentQIndex+1}. ${currentQuestion.q}`;

renderOptions(
currentQuestion.opts,
currentQuestion.a
);

updateAiLevelUI();

}


/* =====================================================
   选项
===================================================== */

function renderOptions(
optionsArr,
correctAns
){

const optionsGrid=
document.getElementById(
"options-grid"
);

optionsGrid.innerHTML="";

const shuffled=
[...optionsArr]
.sort(
()=>Math.random()-.5
);

shuffled.forEach(
(opt,i)=>{

const btn=
document.createElement(
"button"
);

btn.className="btn-opt";

btn.innerText=
`${String.fromCharCode(65+i)}. ${opt}`;

btn.onclick=()=>{
handleAnswer(
opt,
correctAns
);
};

optionsGrid.appendChild(
btn
);

}
);

}


/* =====================================================
   答案
===================================================== */

function handleAnswer(
selectedOpt,
targetAns
){

stats.totalAnswered++;

if(
selectedOpt===targetAns
){

soundAudio.playDing();

if(
wrongAttemptsForCurrentQ===0
){

stats.correctFirstTry++;

if(currentStage===1)
stats.stage1FirstCorrect++;
else
stats.stage2FirstCorrect++;

}

playerData.coins+=10;

updateHUD();

currentQIndex++;

if(
currentQIndex<
stageQuestions.length
){

loadQuestion();

}else{

finishStage();

}

}else{

soundAudio.playBuzz();

wrongAttemptsForCurrentQ++;

stats.aiHelpsCount++;

document
.getElementById(
"app-container"
)
.classList.add("shake");

setTimeout(
()=>{
document
.getElementById(
"app-container"
)
.classList.remove("shake");
},
400
);

if(
teacherConfig.visualMode==="auto"
){

currentAiLevel=
Math.min(
2,
wrongAttemptsForCurrentQ+1
);

}

if(
currentAiLevel>
stats.levelReachMax
){

stats.levelReachMax=
currentAiLevel;

}

updateAiLevelUI();

}

}


/* =====================================================
   AI
===================================================== */

function updateAiLevelUI(){

const badge=
document.getElementById(
"ai-level-badge"
);

const speech=
document.getElementById(
"ai-speech"
);

const workspace=
document.getElementById(
"visual-workspace"
);

workspace.classList.remove(
"active"
);

workspace.innerHTML="";

const n1=
currentQuestion.n1;

const n2=
currentQuestion.n2;

if(currentAiLevel===1){

badge.className=
"ai-level-badge lvl-1";

badge.innerText=
"🟢 Level 1：独立挑战";

speech.innerText=
"请独立计算这道乘法题目，加油！";

speakText(
speech.innerText
);

}else{

badge.className=
"ai-level-badge lvl-2";

badge.innerText=
"🟡 Level 2：标准竖式助手";

speech.innerText=
n2>=10
?
"粉框填个位乘法进位，黄框填十位乘法进位，蓝框填加法进位！"
:
"注意位数对齐，按个位、十位逐位计算！";

speakText(
speech.innerText
);

workspace.classList.add(
"active"
);

renderPlaceValueHouse(
n1,
n2
);

}

}


/* =====================================================
   竖式
===================================================== */

function renderPlaceValueHouse(
n1,
n2
){

const isTwoDigitMul=
n2>=10;

const targetAns=
(n1*n2).toString();

const numCols=
Math.max(
targetAns.length,
3
);

const colNamesAll=
[
"千位",
"百位",
"十位",
"个位"
];

const colNames=
colNamesAll.slice(
4-numCols
);

const n1Str=
n1.toString()
.padStart(
numCols,
" "
);

const n2Str=
n2.toString()
.padStart(
numCols,
" "
);

let html=`

<div style="
display:flex;
flex-direction:column;
align-items:center;
gap:8px;
width:100%;">

<div class="place-value-house">

<div class="pv-col-op">×</div>

`;

for(
let i=0;
i<numCols;
i++
){

const charN1=
n1Str[i]!==" "
?n1Str[i]
:"";

const charN2=
n2Str[i]!==" "
?n2Str[i]
:"";

const isIndividualOnes=
i===numCols-1;

html+=`

<div class="pv-col">

<div class="pv-header">
${colNames[i]}
</div>

<div
class="pv-borrow-box"
style="
visibility:
${isIndividualOnes
?"hidden"
:"visible"};">

<input
type="text"
class="borrow-input"
id="carry-ones-${i}"
maxlength="1"
placeholder="①">

${
isTwoDigitMul
?
`
<input
type="text"
class="borrow-input-tens"
id="carry-tens-${i}"
maxlength="1"
placeholder="②">
`
:""
}

</div>

<div class="pv-val">

<span class="pv-num1">
${charN1}
</span>

<span class="pv-num2">
${charN2}
</span>

</div>

<div class="pv-inputs-group">

`;

if(isTwoDigitMul){

if(isIndividualOnes){

html+=`

<input
type="text"
class="pv-input row-ones"
id="pv-ones-${i}"
maxlength="1"
placeholder="个">

<input
type="text"
class="pv-input row-tens auto-zero"
id="pv-tens-${i}"
value="0"
readonly>

<div style="
height:24px;
margin:4px 0 2px;">
</div>

<div style="
border-top:2px solid var(--accent-yellow);
margin:2px 0;">
</div>

<input
type="text"
class="pv-input final-row"
id="pv-sum-${i}"
maxlength="1"
placeholder="和">

`;

}else{

html+=`

<input
type="text"
class="pv-input row-ones"
id="pv-ones-${i}"
maxlength="1"
placeholder="个">

<input
type="text"
class="pv-input row-tens"
id="pv-tens-${i}"
maxlength="1"
placeholder="十">

<input
type="text"
class="add-carry-input"
id="add-carry-${i}"
maxlength="1"
placeholder="">

<div style="
border-top:2px solid var(--accent-yellow);
margin:2px 0;">
</div>

<input
type="text"
class="pv-input final-row"
id="pv-sum-${i}"
maxlength="1"
placeholder="和">

`;

}

}else{

html+=`

<input
type="text"
class="pv-input final-row"
id="pv-in-${i}"
maxlength="1"
placeholder="?">

`;

}

html+=`

</div>
</div>

`;

}

html+=`

</div>

<div style="
display:flex;
gap:12px;
margin-top:6px;">

<button
class="btn-action"
style="
max-width:240px;
padding:8px 15px;
font-size:18px;"
onclick="
checkPlaceValueInputs(
${numCols},
${isTwoDigitMul}
)">

✍️ 提交答案

</button>

</div>

</div>

`;

document.getElementById(
"visual-workspace"
).innerHTML=html;

}


/* =====================================================
   检查竖式
===================================================== */

function checkPlaceValueInputs(
numCols,
isTwoDigitMul
){

if(isTwoDigitMul){

let sumStr="";

for(
let i=0;
i<numCols;
i++
){

sumStr+=
document.getElementById(
`pv-sum-${i}`
).value.trim();

}

if(
parseInt(sumStr)===
currentQuestion.a
){

handleAnswer(
currentQuestion.a,
currentQuestion.a
);

}else{

soundAudio.playBuzz();

alert(
"最终相加的答案不正确，请检查个位乘积与十位乘积是否正确相加！"
);

}

}else{

let resStr="";

for(
let i=0;
i<numCols;
i++
){

resStr+=
document.getElementById(
`pv-in-${i}`
).value.trim();

}

if(
parseInt(resStr)===
currentQuestion.a
){

handleAnswer(
currentQuestion.a,
currentQuestion.a
);

}else{

soundAudio.playBuzz();

alert(
"填写的乘积不正确，再仔细算算看！"
);

}

}

}


/* =====================================================
   Level 完成
===================================================== */

function finishStage(){

if(currentStage===1){

playerData.keys=2;
playerData.crystals=1;

updateHUD();

showScreen(
"screen-chest"
);

}else{

showReport();

}

}


function nextStage(){

showScreen(
"screen-game"
);

loadStage(2);

}


/* =====================================================
   GOOGLE SHEET
===================================================== */

const GOOGLE_SHEET_WEBAPP_URL=
"https://script.google.com/macros/s/AKfycbxox6Bm3lLwgtEP3rbqxiTzuMUcmApAOE0kdHnfptELVxuro4ULc4IN94ulMzAsMqcB/exec";


async function sendResultToGoogleSheet(
durationSec
){

const level1=
stats.stage1FirstCorrect;

const level2=
stats.stage2FirstCorrect;


const payload={

name:playerData.name,

nama:playerData.name,

school:playerData.school,

className:playerData.className,

kelas:playerData.className,

operation:"Darab",

operasi:"Darab",

preL1:"",

preL1TP:"",

preL2:"",

preL2TP:"",

preTP3:"",

digitalL1:level1,

digitalL1TP:
level1>=2
?"TP3"
:"Belum TP3",

digitalL2:level2,

digitalL2TP:
level2>=2
?"TP3"
:"Belum TP3",

digitalTP3:
(
(level1>=2?1:0)+
(level2>=2?1:0)
)+"/2",

aiHelp:
stats.aiHelpsCount,

digitalTime:
durationSec+" 秒",

masa:
durationSec+" 秒",

postL1:"",

postL1TP:"",

postL2:"",

postL2TP:"",

postTP3:""

};


try{

await fetch(
GOOGLE_SHEET_WEBAPP_URL,
{

method:"POST",

mode:"no-cors",

headers:{
"Content-Type":
"text/plain;charset=UTF-8"
},

body:
JSON.stringify(
payload
)

}
);

return true;

}catch(error){

console.error(
"Google Sheet error:",
error
);

return false;

}

}


/* =====================================================
   报告
===================================================== */

function showReport(){

stats.endTime=
new Date();

const durationSec=
Math.round(
(
stats.endTime-
stats.startTime
)/1000
);


const firstAccuracy=
Math.round(
(
stats.correctFirstTry/10
)*100
);


const digitalTP3=
(
stats.stage1FirstCorrect>=2
?1
:0
)+
(
stats.stage2FirstCorrect>=2
?1
:0
);


const reportHTML=`

<div class="report-item">

<span>
👤 学生姓名:
</span>

<strong>
${playerData.name}
(${playerData.className})
</strong>

</div>


<div class="report-item">

<span>
🏫 学校:
</span>

<strong>
${playerData.school}
</strong>

</div>


<div class="report-item">

<span>
⏱ 答题用时:
</span>

<strong>
${durationSec} 秒
</strong>

</div>


<div class="report-item">

<span>
🎯 答题总数:
</span>

<strong>
${stats.totalAnswered} 次
</strong>

</div>


<div class="report-item">

<span>
🟢 Level 1 首次答对:
</span>

<strong>
${stats.stage1FirstCorrect}/5
→
${stats.stage1FirstCorrect>=2
?"TP3"
:"未达TP3"}
</strong>

</div>


<div class="report-item">

<span>
🟡 Level 2 首次答对:
</span>

<strong>
${stats.stage2FirstCorrect}/5
→
${stats.stage2FirstCorrect>=2
?"TP3"
:"未达TP3"}
</strong>

</div>


<div class="report-item">

<span>
🏆 Digital TP3:
</span>

<strong>
${digitalTP3}/2
</strong>

</div>


<div class="report-item">

<span>
🌟 首次直接正确率:
</span>

<strong>
${firstAccuracy}%
</strong>

</div>


<div class="report-item">

<span>
🤖 AI脚手架触发次数:
</span>

<strong>
${stats.aiHelpsCount} 次
</strong>

</div>

`;


document.getElementById(
"report-content"
).innerHTML=
reportHTML+
`

<div
id="sheet-status"
style="
margin-top:15px;
padding:12px;
background:#006633;
border-radius:12px;
text-align:center;
font-weight:bold;">

📤 正在发送成绩到 Google Sheet...

</div>

`;


showScreen(
"screen-report"
);


sendResultToGoogleSheet(
durationSec
)
.then(
function(success){

const status=
document.getElementById(
"sheet-status"
);

if(success){

status.innerText=
"✅ 成绩已发送到 Google Sheet";

}else{

status.innerText=
"⚠️ Google Sheet 发送失败，请检查 Apps Script";

status.style.background=
"#8b2200";

}

}
);

}

</script>

</body>
</html>
